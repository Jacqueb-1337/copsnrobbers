<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>CNR Mods — play.jacqueb.me</title>
<meta name="description" content="Browse and download mods for Cops n Robbers Revival." />
<style>
  :root {
    --bg:#0f1720; --card:#0b1220; --muted:#97a0b3;
    --accent:#6ee7b7; --accent-2:#60a5fa; --glass:rgba(255,255,255,0.04);
    --card-pad:22px; --radius:14px;
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background-color: var(--bg);
    background-image:
      radial-gradient(1200px 600px at 10% 10%, rgba(96,165,250,0.06), transparent 60%),
      linear-gradient(180deg, #071226 0%, var(--bg) 60%);
    background-size: 100% 100%;
    background-repeat: no-repeat;
    color: #e6eef8;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    padding: 40px 24px;
    font-size: 15px;
    min-height: 100vh;
  }
  .wrap { max-width: 900px; margin: 0 auto; }

  /* ── Header ─────────────────────────────────────────── */
  .site-header {
    display: flex; align-items: center; gap: 18px;
    margin-bottom: 32px; flex-wrap: wrap;
  }
  .logo {
    width: 52px; height: 52px; border-radius: 12px;
    background: linear-gradient(135deg, var(--accent-2), var(--accent));
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; color: #04233a; font-size: 18px; flex-shrink: 0;
    box-shadow: 0 6px 22px rgba(12,22,40,0.6), inset 0 -6px 18px rgba(255,255,255,0.02);
  }
  .header-text h1 { margin: 0; font-size: 20px; }
  .header-text .sub { color: var(--muted); font-size: 13px; margin-top: 3px; }
  .header-back {
    margin-left: auto;
    color: var(--muted); text-decoration: none; font-size: 13px;
    padding: 8px 14px; border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.06);
    transition: color .15s, border-color .15s;
  }
  .header-back:hover { color: #e6eef8; border-color: rgba(255,255,255,0.14); }

  /* ── Mod grid ────────────────────────────────────────── */
  #mod-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }
  .mod-card {
    background: linear-gradient(180deg, rgba(255,255,255,0.025), rgba(255,255,255,0.01));
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: var(--radius);
    padding: 20px;
    display: flex; flex-direction: column; gap: 10px;
    cursor: pointer;
    transition: border-color .15s, transform .1s;
  }
  .mod-card:hover { border-color: rgba(110,231,183,0.25); transform: translateY(-1px); }
  .mod-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .mod-name { font-weight: 700; font-size: 15px; }
  .version-badge {
    font-size: 11px; font-weight: 600;
    background: rgba(110,231,183,0.12); color: var(--accent);
    padding: 3px 8px; border-radius: 999px; white-space: nowrap; flex-shrink: 0;
    border: 1px solid rgba(110,231,183,0.2);
  }
  .mod-desc {
    color: var(--muted); font-size: 13px; line-height: 1.55;
    flex: 1;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .mod-actions { display: flex; gap: 8px; margin-top: 4px; }
  .btn-primary {
    flex: 1; padding: 9px 0; background: linear-gradient(90deg, var(--accent), var(--accent-2));
    color: #052233; border: none; border-radius: 9px; font-weight: 700; font-size: 13px;
    cursor: pointer; text-align: center; text-decoration: none; display: block;
    transition: opacity .15s;
  }
  .btn-primary:hover { opacity: .88; }
  .btn-secondary {
    padding: 9px 14px; background: rgba(255,255,255,0.04);
    color: #e6eef8; border: 1px solid rgba(255,255,255,0.08); border-radius: 9px;
    font-size: 13px; cursor: pointer; white-space: nowrap;
    transition: background .15s, border-color .15s;
  }
  .btn-secondary:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.15); }

  /* ── Detail view ─────────────────────────────────────── */
  #mod-detail { display: none; }
  #mod-detail.visible { display: block; }
  .detail-back {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--muted); background: none; border: none; cursor: pointer;
    font-size: 14px; padding: 0 0 22px 0; transition: color .15s;
  }
  .detail-back:hover { color: #e6eef8; }
  .detail-back svg { width: 16px; height: 16px; flex-shrink: 0; }
  .detail-card {
    background: linear-gradient(180deg, rgba(255,255,255,0.025), rgba(255,255,255,0.01));
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: var(--radius); padding: 28px;
  }
  .detail-hero { display: flex; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
  .detail-hero-text { flex: 1; min-width: 200px; }
  .detail-title { font-size: 22px; font-weight: 700; margin: 0 0 6px 0; }
  .detail-sub { color: var(--muted); font-size: 13px; }
  .detail-download-hero {
    padding: 10px 22px; background: linear-gradient(90deg, var(--accent), var(--accent-2));
    color: #052233; border: none; border-radius: 10px; font-weight: 700; font-size: 14px;
    cursor: pointer; text-decoration: none; display: inline-block; white-space: nowrap;
    transition: opacity .15s;
  }
  .detail-download-hero:hover { opacity: .88; }
  .detail-desc {
    color: #c8d4e8; line-height: 1.7; font-size: 14px;
    padding-bottom: 24px; border-bottom: 1px solid rgba(255,255,255,0.05);
    margin-bottom: 24px;
  }
  .detail-section-title {
    font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); margin-bottom: 14px;
  }
  .version-list { display: flex; flex-direction: column; gap: 12px; }
  .version-row {
    padding: 14px 16px; border-radius: 10px;
    background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.04);
    display: flex; flex-direction: column; gap: 8px;
  }
  .version-row.is-latest {
    border-color: rgba(110,231,183,0.2);
    background: rgba(110,231,183,0.04);
  }
  .version-row-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .v-num { font-weight: 700; font-size: 14px; }
  .v-latest-badge {
    font-size: 10px; font-weight: 700; background: rgba(110,231,183,0.15);
    color: var(--accent); padding: 2px 7px; border-radius: 999px;
    border: 1px solid rgba(110,231,183,0.25); text-transform: uppercase; letter-spacing:.04em;
  }
  .v-latest-only-label {
    font-size: 12px; color: var(--muted); font-style: italic; margin-left: auto;
  }
  .v-dl-btn {
    margin-left: auto; padding: 7px 16px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    color: #052233; border: none; border-radius: 8px; font-weight: 700; font-size: 12px;
    cursor: pointer; text-decoration: none; display: inline-block; white-space: nowrap;
    transition: opacity .15s;
  }
  .v-dl-btn:hover { opacity: .88; }
  .v-dl-btn.old {
    background: rgba(255,255,255,0.07); color: var(--muted);
    border: 1px solid rgba(255,255,255,0.08);
  }
  .v-dl-btn.old:hover { background: rgba(255,255,255,0.12); }
  .v-changelog { font-size: 13px; color: var(--muted); line-height: 1.55; }

  /* ── Loading / error ─────────────────────────────────── */
  .state-msg {
    text-align: center; padding: 60px 20px; color: var(--muted); font-size: 14px;
  }
  .state-msg .big { font-size: 32px; margin-bottom: 10px; }
  .error-msg { color: #ff8a8a; }

  /* ── Footer ──────────────────────────────────────────── */
  footer {
    margin-top: 40px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.04);
    display: flex; justify-content: space-between; align-items: center;
    color: var(--muted); font-size: 13px; flex-wrap: wrap; gap: 8px;
  }
  footer a { color: var(--muted); text-decoration: none; }
  footer a:hover { color: #e6eef8; }

  @media (max-width: 540px) {
    body { padding: 24px 16px; }
    .detail-card { padding: 20px 16px; }
    .version-row-top { gap: 8px; }
    .v-dl-btn { margin-left: 0; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="site-header">
    <div class="logo">M</div>
    <div class="header-text">
      <h1>CNR Mods</h1>
      <div class="sub">Official mod repository for Cops n Robbers Revival</div>
    </div>
    <a class="header-back" href="https://play.jacqueb.me/">← Back to site</a>
  </header>

  <div id="loading" class="state-msg">
    <div class="big">⏳</div>
    <div>Loading mods…</div>
  </div>

  <div id="error" class="state-msg" style="display:none">
    <div class="big">⚠️</div>
    <div class="error-msg" id="error-msg">Failed to load repo.json</div>
  </div>

  <!-- Mod grid (list view) -->
  <div id="mod-grid"></div>

  <!-- Detail view -->
  <div id="mod-detail">
    <button class="detail-back" id="back-btn" onclick="showGrid()">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="10 3 5 8 10 13"/>
      </svg>
      All mods
    </button>
    <div class="detail-card" id="detail-content"></div>
  </div>

  <footer>
    <div>© CNR Revival</div>
    <div><a href="https://github.com/Jacqueb-1337/copsnrobbers" target="_blank" rel="noopener">github.com/Jacqueb-1337/copsnrobbers</a></div>
  </footer>
</div>

<script>
'use strict';

let repoData = null;

/* ── Fetch repo.json ───────────────────────────────────────────── */
fetch('./repo.json')
  .then(r => {
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
  })
  .then(data => {
    repoData = data;
    document.getElementById('loading').style.display = 'none';
    renderGrid(data.mods || []);
  })
  .catch(err => {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error').style.display = '';
    document.getElementById('error-msg').textContent = 'Could not load mod list: ' + err.message;
  });

/* ── Helpers ───────────────────────────────────────────────────── */
function esc(s) {
  return String(s || '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function latestVersion(mod) {
  return mod.latestVersion || (mod.versions && mod.versions[0] && mod.versions[0].version) || '';
}

function latestUrl(mod) {
  return mod.latestUrl || (mod.versions && mod.versions[0] && mod.versions[0].url) || '';
}

function dlAttr(url, filename) {
  // Force browser download rather than navigation
  return `href="${esc(url)}" download="${esc(filename || '')}"`;
}

/* ── Grid (list) view ──────────────────────────────────────────── */
function renderGrid(mods) {
  const grid = document.getElementById('mod-grid');
  if (!mods.length) {
    grid.innerHTML = '<div class="state-msg"><div class="big">📭</div><div>No mods found in this repo.</div></div>';
    return;
  }
  grid.innerHTML = mods.map((mod, i) => {
    const ver = latestVersion(mod);
    const url = latestUrl(mod);
    const desc = esc(mod.description || '');
    const name = esc(mod.name || mod.id);
    const fname = esc(mod.filename || '');
    return `
      <div class="mod-card" onclick="showDetail(${i})">
        <div class="mod-card-top">
          <span class="mod-name">${name}</span>
          ${ver ? `<span class="version-badge">v${esc(ver)}</span>` : ''}
        </div>
        <div class="mod-desc">${desc}</div>
        <div class="mod-actions">
          ${url ? `<a class="btn-primary" ${dlAttr(url, mod.filename)} onclick="event.stopPropagation()">⬇ Download</a>` : ''}
          <button class="btn-secondary" onclick="event.stopPropagation(); showDetail(${i})">Details</button>
        </div>
      </div>`;
  }).join('');
}

/* ── Detail view ───────────────────────────────────────────────── */
function showDetail(idx) {
  const mod = repoData.mods[idx];
  const ver = latestVersion(mod);
  const url = latestUrl(mod);
  const versions = mod.versions || (ver ? [{ version: ver, url: url, changelog: '' }] : []);

  const versionsHtml = versions.map((v, i) => {
    const isLatest = i === 0;
    const canDownload = isLatest || !mod.latestOnly;
    return `
      <div class="version-row ${isLatest ? 'is-latest' : ''}">
        <div class="version-row-top">
          <span class="v-num">v${esc(v.version)}</span>
          ${isLatest ? '<span class="v-latest-badge">Latest</span>' : ''}
          ${!isLatest && mod.latestOnly ? '<span class="v-latest-only-label">latest version only</span>' : ''}
          ${canDownload && v.url
            ? `<a class="v-dl-btn ${isLatest ? '' : 'old'}" ${dlAttr(v.url, mod.filename)} onclick="event.stopPropagation()">⬇ Download</a>`
            : ''}
        </div>
        ${v.changelog ? `<div class="v-changelog">${esc(v.changelog)}</div>` : ''}
      </div>`;
  }).join('');

  document.getElementById('detail-content').innerHTML = `
    <div class="detail-hero">
      <div class="detail-hero-text">
        <div class="detail-title">${esc(mod.name || mod.id)}</div>
        <div class="detail-sub">${esc(mod.filename || '')}${ver ? ` · latest v${esc(ver)}` : ''}</div>
      </div>
      ${url ? `<a class="detail-download-hero" ${dlAttr(url, mod.filename)}>⬇ Download latest</a>` : ''}
    </div>
    ${mod.description ? `<div class="detail-desc">${esc(mod.description)}</div>` : ''}
    ${versionsHtml.trim() ? `
      <div class="detail-section-title">Version History</div>
      <div class="version-list">${versionsHtml}</div>` : ''}`;

  document.getElementById('mod-grid').style.display = 'none';
  document.getElementById('mod-detail').classList.add('visible');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showGrid() {
  document.getElementById('mod-detail').classList.remove('visible');
  document.getElementById('mod-grid').style.display = '';
}
</script>
</body>
</html>

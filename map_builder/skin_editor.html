<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CNR Skin Editor</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #12121e; color: #dde; font-family: 'Segoe UI', sans-serif; font-size: 13px; display: flex; flex-direction: column; height: 100vh; overflow: hidden; user-select: none; }

/* ── Toolbar ── */
#toolbar { display: flex; align-items: center; gap: 6px; padding: 5px 10px; background: #1a1a2e; border-bottom: 1px solid #252545; flex-shrink: 0; flex-wrap: wrap; }
#toolbar h1 { font-size: 13px; color: #e94560; margin-right: 4px; white-space: nowrap; }
.sep { width: 1px; background: #252545; align-self: stretch; margin: 0 2px; }
.btn { padding: 4px 10px; border: 1px solid #333360; background: #1a1a2e; color: #dde; border-radius: 4px; cursor: pointer; font-size: 12px; white-space: nowrap; }
.btn:hover { background: #252545; }
.btn.active { background: #e94560; color: #fff; border-color: #e94560; }
.btn.green { background: #1a3a22; border-color: #2d6a4f; }
.btn.green:hover { background: #2d6a4f; }
.file-btn { position: relative; overflow: hidden; }
.file-btn input[type=file] { position: absolute; opacity: 0; inset: 0; cursor: pointer; }

/* ── Main ── */
#main { display: flex; flex: 1; overflow: hidden; }

/* ── Left panel ── */
#left-panel { width: 180px; background: #1a1a2e; border-right: 1px solid #252545; display: flex; flex-direction: column; gap: 0; flex-shrink: 0; overflow-y: auto; }
.panel-section { padding: 10px; border-bottom: 1px solid #252545; }
.panel-section h3 { font-size: 10px; text-transform: uppercase; color: #666688; margin-bottom: 8px; letter-spacing: 1px; }

/* Tools */
.tool-btn { display: flex; align-items: center; gap: 7px; width: 100%; padding: 6px 8px; margin-bottom: 4px; background: #12121e; border: 1px solid #333360; border-radius: 4px; cursor: pointer; font-size: 12px; color: #dde; }
.tool-btn:hover { background: #252545; }
.tool-btn.active { background: #e94560; border-color: #e94560; color: #fff; }

/* Color picker area */
#color-preview { width: 100%; height: 32px; border-radius: 4px; border: 2px solid #333360; margin-bottom: 6px; cursor: pointer; }
#color-hex { width: 100%; background: #12121e; border: 1px solid #333360; border-radius: 3px; color: #dde; padding: 4px 7px; font-size: 12px; font-family: monospace; outline: none; margin-bottom: 4px; }
#color-hex:focus { border-color: #e94560; }
#color-native { width: 32px; height: 26px; border: 1px solid #333360; border-radius: 3px; cursor: pointer; padding: 1px; vertical-align: middle; background: #12121e; }
#color-row { display: flex; align-items: center; gap: 6px; }
#color-row span { font-size: 11px; color: #666688; }

/* Recent colors */
#recent-colors { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.swatch { width: 20px; height: 20px; border-radius: 3px; border: 1px solid #333360; cursor: pointer; flex-shrink: 0; }
.swatch:hover { border-color: #dde; }

/* Zoom */
#zoom-val { font-size: 12px; color: #aaaacc; min-width: 32px; text-align: center; }

/* ── Center: 2D canvas ── */
#canvas-wrap { flex: 1; position: relative; overflow: hidden; background: #0e0e1a; display: block; }
#skin-canvas { image-rendering: pixelated; cursor: crosshair; display: block; position: absolute; left: 50%; top: 50%; transform-origin: center center; }
#overlay-canvas { position: absolute; pointer-events: none; image-rendering: pixelated; left: 50%; top: 50%; transform-origin: center center; }

/* ── Right: 3D preview ── */
#right-panel { width: 300px; background: #1a1a2e; border-left: 1px solid #252545; display: flex; flex-direction: column; flex-shrink: 0; overflow: hidden; }
#right-panel h3 { font-size: 10px; text-transform: uppercase; color: #666688; letter-spacing: 1px; padding: 10px 10px 6px; border-bottom: 1px solid #252545; flex-shrink: 0; }
#preview-canvas { flex: 1; display: block; width: 100%; }

/* ── Bottom bar ── */
#bottom-bar { display: flex; align-items: center; gap: 8px; padding: 4px 10px; background: #1a1a2e; border-top: 1px solid #252545; flex-shrink: 0; }
#status { font-size: 11px; color: #666688; flex: 1; }
#pixel-pos { font-size: 11px; color: #8888aa; font-family: monospace; }

/* Scrollbar */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: #12121e; }
::-webkit-scrollbar-thumb { background: #333360; border-radius: 3px; }

/* ── Mode tabs ── */
.mode-tab { padding: 4px 12px; border: 1px solid #333360; background: #12121e; color: #8888aa; border-radius: 4px; cursor: pointer; font-size: 12px; white-space: nowrap; }
.mode-tab.active { background: #e94560; color: #fff; border-color: #e94560; }

/* ── Model mode layout ── */
body.model-mode #canvas-wrap { display: none !important; }
body.model-mode #right-panel { flex: 1; width: auto; border-left: none; }
body.uv-mode .model-only { display: none !important; }
body.model-mode .uv-only { display: none !important; }

/* ── Parts list (model mode) ── */
.part-row { display: flex; align-items: center; gap: 5px; padding: 4px 6px; cursor: pointer; border-radius: 3px; }
.part-row:hover { background: #252545; }
.part-row.selected .part-label { color: #e94560; }
.part-eye { background: none; border: none; cursor: pointer; font-size: 13px; line-height: 1; padding: 0; flex-shrink: 0; }
.part-label { font-size: 12px; flex: 1; }
.part-isolate { background: none; border: 1px solid #333360; border-radius: 3px; cursor: pointer; font-size: 10px; color: #666688; padding: 1px 5px; flex-shrink: 0; }
.part-isolate:hover { color: #dde; border-color: #8888aa; }
</style>

{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",

<body>

<div id="toolbar">
  <h1>◈ CNR Skin Editor</h1>

  </label>

  <div class="sep"></div>
  <label class="btn file-btn" title="Open a PNG skin file">
    📂 Open PNG
    <input type="file" id="file-input" accept=".png,image/png">
  </label>

    🎮 Import MC Skin
    <input type="file" id="mc-import-input" accept=".png,image/png">
  </label>
  <button class="btn" id="btn-toggle-overlay" title="Toggle preview overlay layers">Overlay: On</button>
  <button class="btn green" id="btn-export" title="Download as PNG">⬇ Save PNG</button>
  <div class="sep"></div>
  <span style="font-size:11px;color:#666688">Zoom:</span>

</div>

<div id="main">

  <!-- LEFT -->
  <div id="left-panel">
    <div class="panel-section uv-only">
      <h3>Tools</h3>

        <button class="btn" id="btn-paste-sel" title="Create a movable paste preview">Paste</button>
        <button class="btn" id="btn-apply-sel" title="Commit the pasted pixels to the skin">Apply</button>
        <button class="btn" id="btn-cancel-sel" title="Cancel the floating paste preview">Cancel</button>
      </div>
    </div>
    <div class="panel-section">
      <h3>Color</h3>
      <div id="color-preview" title="Click to open color picker"></div>

      </div>
      <div id="recent-colors"></div>
    </div>
    <div class="panel-section">
      <h3>Brush size</h3>
      <div style="display:flex;align-items:center;gap:6px">
        <button class="btn" id="btn-brush-dec">−</button>
        <span id="brush-val" style="font-size:12px;color:#aaaacc;min-width:24px;text-align:center">1</span>
        <button class="btn" id="btn-brush-inc">+</button>
        <span style="font-size:11px;color:#666688">px</span>
      </div>
    </div>
    <div class="panel-section uv-only">
      <h3>Parts</h3>
      <div id="parts-legend" style="font-size:11px;color:#666688;line-height:1.7">
        <div><span style="color:#ff4444">■</span> Head</div>
        <div><span style="color:#ff4444;opacity:.5">■</span> Hat / overlay</div>
        <div><span style="color:#44ff44">■</span> Body</div>
        <div><span style="color:#4488ff">■</span> Right arm</div>
        <div><span style="color:#44ffff">■</span> Left arm</div>
        <div><span style="color:#ffaa00">■</span> Right leg</div>
        <div><span style="color:#ff66ff">■</span> Left leg</div>
      </div>
    </div>
    <div class="panel-section model-only">
      <h3>Model Tools</h3>
      <button class="tool-btn model-tool-btn active" data-tool="select">⬚ Select</button>
      <button class="tool-btn model-tool-btn" data-tool="paint">✏ Paint</button>
      <button class="tool-btn model-tool-btn" data-tool="bucket">🪣 Bucket</button>
      <button class="tool-btn model-tool-btn" data-tool="picker">🔬 Picker</button>
    </div>
    <div class="panel-section model-only">
      <h3>Parts</h3>
      <div id="parts-list"></div>
      <button class="btn" id="btn-show-all" style="width:100%;margin-top:6px;font-size:11px">Show All</button>
    </div>
  </div>

    <canvas id="skin-canvas"></canvas>
    <canvas id="overlay-canvas"></canvas>
  </div>

    <canvas id="preview-canvas"></canvas>
  </div>

</div>

<div id="bottom-bar">
  <span id="status">Open a 64×32 or 64×64 PNG skin to start painting.</span>
  <span id="pixel-pos"></span>
</div>

let activeUVParts = PLAYER_UV_PARTS;
let customEnemyObjText = null;
let activeSkinType = 'player';

let selectedPart = null;

// ─── State ────────────────────────────────────────────────────────────────────

const state = {
  tool:      'pencil',
  color:     '#ff0000',
  brushSize: 1,
  zoom:      8,
  uvGrid:    true,
  overlay:   true,
  painting:  false,
  recentColors: [],
  undoStack: [],
  redoStack: [],
  panOffset: { x: 0, y: 0 },
  panStart:  null,
  selStart:  null,
  selRect:   null,
  selClipboard: null,
  selFloating: null,
  selDrag:   null,
};

// ─── Canvas setup ─────────────────────────────────────────────────────────────

const skinCanvas    = document.getElementById('skin-canvas');
const skinCtx       = skinCanvas.getContext('2d');
const overlayCanvas = document.getElementById('overlay-canvas');
const overlayCtx    = overlayCanvas.getContext('2d');

// The actual pixel data lives here (SKIN_W × SKIN_H)
const pixelCanvas = document.createElement('canvas');
pixelCanvas.width  = SKIN_W;
pixelCanvas.height = SKIN_H;
const pixelCtx = pixelCanvas.getContext('2d');

const compositeCanvas = document.createElement('canvas');
compositeCanvas.width = SKIN_W;
compositeCanvas.height = SKIN_H;
const compositeCtx = compositeCanvas.getContext('2d');

// Initialise to transparent checkerboard-visible state (transparent black)
pixelCtx.clearRect(0, 0, SKIN_W, SKIN_H);

function getZoomedSize() {
  return { w: SKIN_W * state.zoom, h: SKIN_H * state.zoom };
}

function resizeCanvases() {
  const { w, h } = getZoomedSize();
  skinCanvas.width  = w;
  skinCanvas.height = h;
  skinCanvas.style.width  = w + 'px';
  skinCanvas.style.height = h + 'px';
  overlayCanvas.width  = w;
  overlayCanvas.height = h;
  overlayCanvas.style.width  = w + 'px';
  overlayCanvas.style.height = h + 'px';
  applyCanvasPan();
  redrawSkin();
  redrawOverlay();
}

function applyCanvasPan() {
  const tx = state.panOffset.x | 0;
  const ty = state.panOffset.y | 0;
  const t = `translate(-50%, -50%) translate(${tx}px, ${ty}px)`;
  skinCanvas.style.transform = t;
  overlayCanvas.style.transform = t;
}

function redrawSkin() {
  const { w, h } = getZoomedSize();
  skinCtx.clearRect(0, 0, w, h);

  // Checkerboard background
  const cs = state.zoom < 4 ? 4 : state.zoom;
  for (let y = 0; y < SKIN_H; y++) {
    for (let x = 0; x < SKIN_W; x++) {
      skinCtx.fillStyle = ((x + y) & 1) ? '#2a2a3e' : '#1e1e30';
      skinCtx.fillRect(x * state.zoom, y * state.zoom, state.zoom, state.zoom);
    }
  }

  // Draw pixels (nearest-neighbour)
  skinCtx.imageSmoothingEnabled = false;
  skinCtx.drawImage(pixelCanvas, 0, 0, w, h);
}

function redrawOverlay() {
  const { w, h } = getZoomedSize();
  overlayCtx.clearRect(0, 0, w, h);

  if (!state.uvGrid) return;

  // Draw UV part regions
  const z = state.zoom;
  for (const [label, x0, y0, x1, y1, col] of activeUVParts) {
    overlayCtx.strokeStyle = col.replace(/[\d.]+\)$/, '0.85)');
    overlayCtx.lineWidth   = 1;
    overlayCtx.strokeRect(x0 * z + 0.5, y0 * z + 0.5, (x1 - x0) * z - 1, (y1 - y0) * z - 1);
  }

  // Grid lines (only when zoom >= 4)
  if (state.zoom >= 4) {
    overlayCtx.strokeStyle = 'rgba(255,255,255,0.06)';
    overlayCtx.lineWidth = 0.5;
    for (let x = 0; x <= SKIN_W; x++) {
      overlayCtx.beginPath();
      overlayCtx.moveTo(x * z, 0);
      overlayCtx.lineTo(x * z, h);
      overlayCtx.stroke();
    }
    for (let y = 0; y <= SKIN_H; y++) {
      overlayCtx.beginPath();
      overlayCtx.moveTo(0, y * z);
      overlayCtx.lineTo(w, y * z);
      overlayCtx.stroke();
    }
  }
}

function normalizeRect(x0, y0, x1, y1) {
  const minX = Math.max(0, Math.min(x0, x1));
  const minY = Math.max(0, Math.min(y0, y1));
  const maxX = Math.min(SKIN_W, Math.max(x0, x1) + 1);
  const maxY = Math.min(SKIN_H, Math.max(y0, y1) + 1);
  return {
    x: minX,
    y: minY,
    w: Math.max(0, maxX - minX),
    h: Math.max(0, maxY - minY),
  };
}

function rectContains(rect, x, y) {
  return rect && x >= rect.x && y >= rect.y && x < rect.x + rect.w && y < rect.y + rect.h;
}

function copySelection(rect) {
  if (!rect || rect.w <= 0 || rect.h <= 0) return;
  const img = pixelCtx.getImageData(rect.x, rect.y, rect.w, rect.h);
  const c = document.createElement('canvas');
  c.width = rect.w;
  c.height = rect.h;
  c.getContext('2d').putImageData(img, 0, 0);
  state.selClipboard = { w: rect.w, h: rect.h, data: img, canvas: c };
  state.selRect = { x: rect.x, y: rect.y, w: rect.w, h: rect.h };
  state.selFloating = null;
  drawSelectionOverlay();
  update3dTexture();
}

function pasteSelection() {
  if (!state.selClipboard) return;
  const src = state.selClipboard;
  state.selFloating = {
    x: state.selRect ? state.selRect.x : 0,
    y: state.selRect ? state.selRect.y : 0,
    w: src.w,
    h: src.h,
    data: src.data,
    canvas: src.canvas,
  };
  state.selDrag = { ox: state.selFloating.x, oy: state.selFloating.y, px: state.selFloating.x, py: state.selFloating.y };
  drawSelectionOverlay();
  update3dTexture();
}

function applySelection() {
  if (!state.selFloating) return;
  pushUndo();
  pixelCtx.putImageData(state.selFloating.data, state.selFloating.x, state.selFloating.y);
  state.selRect = { x: state.selFloating.x, y: state.selFloating.y, w: state.selFloating.w, h: state.selFloating.h };
  state.selFloating = null;
  state.selDrag = null;
  redrawSkin();
  drawSelectionOverlay();
  update3dTexture();
}

function cancelSelection() {
  state.selFloating = null;
  state.selDrag = null;
  drawSelectionOverlay();
  update3dTexture();
}

function drawSelectionOverlay() {
  redrawOverlay();
  const { w, h } = getZoomedSize();
  const z = state.zoom;
  if (state.selRect && state.selRect.w > 0 && state.selRect.h > 0) {
    overlayCtx.save();
    overlayCtx.strokeStyle = 'rgba(255,255,255,0.95)';
    overlayCtx.setLineDash([4, 2]);
    overlayCtx.lineWidth = 1;
    overlayCtx.strokeRect(state.selRect.x * z + 0.5, state.selRect.y * z + 0.5, state.selRect.w * z - 1, state.selRect.h * z - 1);
    overlayCtx.restore();
  }
  if (state.selFloating) {
    overlayCtx.save();
    overlayCtx.globalAlpha = 0.45;
    overlayCtx.drawImage(state.selFloating.canvas, state.selFloating.x * z, state.selFloating.y * z, state.selFloating.w * z, state.selFloating.h * z);
    overlayCtx.restore();
    overlayCtx.save();
    overlayCtx.strokeStyle = 'rgba(255,255,255,0.95)';
    overlayCtx.setLineDash([4, 2]);
    overlayCtx.lineWidth = 1;
    overlayCtx.strokeRect(state.selFloating.x * z + 0.5, state.selFloating.y * z + 0.5, state.selFloating.w * z - 1, state.selFloating.h * z - 1);
    overlayCtx.restore();
  }
}

// ─── Pixel paint ─────────────────────────────────────────────────────────────

function canvasToPixel(cx, cy) {
  const rect = skinCanvas.getBoundingClientRect();
  const lx   = cx - rect.left;
  const ly   = cy - rect.top;
  return {
    px: Math.floor(lx / state.zoom),
    py: Math.floor(ly / state.zoom),
  };
}

function paintPixel(px, py) {
  return paintPixelMode(px, py, state.tool, state.color);
}

function paintPixelMode(px, py, mode, color) {
  if (px < 0 || py < 0 || px >= SKIN_W || py >= SKIN_H) return;
  const b = state.brushSize;
  const half = Math.floor(b / 2);
  for (let dy = -half; dy < b - half; dy++) {
    for (let dx = -half; dx < b - half; dx++) {
      const nx = px + dx, ny = py + dy;
      if (nx < 0 || ny < 0 || nx >= SKIN_W || ny >= SKIN_H) continue;
      if (mode === 'eraser') {
        pixelCtx.clearRect(nx, ny, 1, 1);
      } else {
        pixelCtx.fillStyle = color || state.color;
        pixelCtx.fillRect(nx, ny, 1, 1);
      }
    }
  }
  redrawSkin();
  update3dTexture();
}

function rgbaKeyAt(px, py) {
  if (px < 0 || py < 0 || px >= SKIN_W || py >= SKIN_H) return null;
  const d = pixelCtx.getImageData(px, py, 1, 1).data;
  return `${d[0]},${d[1]},${d[2]},${d[3]}`;
}

function colorToRgba(hex) {
  if (!hex) return '0,0,0,0';
  if (!hex.startsWith('#')) hex = '#' + hex;
  const n = parseInt(hex.slice(1), 16);
  const r = (n >> 16) & 255;
  const g = (n >> 8) & 255;
  const b = n & 255;
  return `${r},${g},${b},255`;
}

function floodFillPixels(startX, startY, fillColor) {
  if (startX < 0 || startY < 0 || startX >= SKIN_W || startY >= SKIN_H) return;
  const targetKey = rgbaKeyAt(startX, startY);
  if (!targetKey) return;
  const fillKey = colorToRgba(fillColor);
  if (targetKey === fillKey) return;

  const img = pixelCtx.getImageData(0, 0, SKIN_W, SKIN_H);
  const data = img.data;
  const startIdx = (startY * SKIN_W + startX) * 4;
  const startColor = [data[startIdx], data[startIdx + 1], data[startIdx + 2], data[startIdx + 3]];
  const fillMatch = /^#?[0-9a-fA-F]{6}$/.test(fillColor) ? colorToRgba(fillColor).split(',').map(Number) : null;
  const seen = new Uint8Array(SKIN_W * SKIN_H);
  const stack = [[startX, startY]];

  function matchAt(x, y) {
    const idx = (y * SKIN_W + x) * 4;
    return data[idx] === startColor[0] &&
           data[idx + 1] === startColor[1] &&
           data[idx + 2] === startColor[2] &&
           data[idx + 3] === startColor[3];
  }

  while (stack.length) {
    const [x, y] = stack.pop();
    const idx1 = y * SKIN_W + x;
    if (seen[idx1]) continue;
    seen[idx1] = 1;
    if (!matchAt(x, y)) continue;

    const idx = idx1 * 4;
    if (fillMatch) {
      data[idx] = fillMatch[0];
      data[idx + 1] = fillMatch[1];
      data[idx + 2] = fillMatch[2];
      data[idx + 3] = fillMatch[3];
    }

    if (x > 0) stack.push([x - 1, y]);
    if (x + 1 < SKIN_W) stack.push([x + 1, y]);
    if (y > 0) stack.push([x, y - 1]);
    if (y + 1 < SKIN_H) stack.push([x, y + 1]);
  }

  pixelCtx.putImageData(img, 0, 0);
  redrawSkin();
  update3dTexture();
}

// ─── Undo / Redo ─────────────────────────────────────────────────────────────

function captureSnapshot() {
  return pixelCtx.getImageData(0, 0, SKIN_W, SKIN_H);
}

function pushUndo() {
  state.undoStack.push(captureSnapshot());
  if (state.undoStack.length > 60) state.undoStack.shift();
  state.redoStack.length = 0;
}

function undo() {
  if (!state.undoStack.length) return;
  state.redoStack.push(captureSnapshot());
  const snap = state.undoStack.pop();
  pixelCtx.putImageData(snap, 0, 0);
  redrawSkin();
  update3dTexture();
}

function redo() {
  if (!state.redoStack.length) return;
  state.undoStack.push(captureSnapshot());
  const snap = state.redoStack.pop();
  pixelCtx.putImageData(snap, 0, 0);
  redrawSkin();
  update3dTexture();
}

// ─── Color management ────────────────────────────────────────────────────────

function setColor(hex) {
  if (!/^#?[0-9a-fA-F]{6}$/.test(hex)) return;
  if (!hex.startsWith('#')) hex = '#' + hex;
  state.color = hex;
  document.getElementById('color-preview').style.background = hex;
  document.getElementById('color-hex').value = hex.slice(1).toUpperCase();
  document.getElementById('color-native').value = hex;
}

function addRecentColor(hex) {
  state.recentColors = [hex, ...state.recentColors.filter(c => c !== hex)].slice(0, 16);
  renderRecentColors();
}

function renderRecentColors() {
  const el = document.getElementById('recent-colors');
  el.innerHTML = '';
  for (const c of state.recentColors) {
    const s = document.createElement('div');
    s.className = 'swatch';
    s.style.background = c;
    s.title = c;
    s.addEventListener('click', () => setColor(c));
    el.appendChild(s);
  }
}

// Init color
setColor('#ff6655');

// ─── Mouse events (paint) ────────────────────────────────────────────────────

let lastPx = -1, lastPy = -1;

skinCanvas.addEventListener('mousedown', e => {
  if (e.button === 1) { // Middle button pan
    state.panStart = { mx: e.clientX, my: e.clientY };
    e.preventDefault();
    skinCanvas.style.cursor = 'grabbing';
    return;
  }
  if (e.button !== 0) return;
  const { px, py } = canvasToPixel(e.clientX, e.clientY);
  if (state.tool === 'select') {
    if (state.selFloating && rectContains(state.selFloating, px, py)) {
      state.selDrag = { ox: state.selFloating.x, oy: state.selFloating.y, dx: px - state.selFloating.x, dy: py - state.selFloating.y, moving: true };
    } else {
      state.selStart = { x: px, y: py };
      state.selRect = normalizeRect(px, py, px, py);
      state.selFloating = null;
      state.selDrag = null;
    }
    drawSelectionOverlay();
    update3dTexture();
    e.preventDefault();
    return;
  }
  if (state.tool === 'picker') {
    pickColorFromPixel(px, py);
    return;
  }
  if (state.tool === 'bucket') {
    pushUndo();
    addRecentColor(state.color);
    floodFillPixels(px, py, state.color);
    return;
  }
  pushUndo();
  if (state.tool === 'pencil') addRecentColor(state.color);
  state.painting = true;
  lastPx = px; lastPy = py;
  paintPixel(px, py);
});

skinCanvas.addEventListener('mousemove', e => {
  if (state.panStart) {
    const dx = e.clientX - state.panStart.mx;
    const dy = e.clientY - state.panStart.my;
    state.panStart = { mx: e.clientX, my: e.clientY };
    state.panOffset.x += dx;
    state.panOffset.y += dy;
    applyCanvasPan();
    return;
  }
  const { px, py } = canvasToPixel(e.clientX, e.clientY);
  document.getElementById('pixel-pos').textContent = `(${px}, ${py})`;
  if (state.tool === 'select') {
    if (state.selDrag && state.selDrag.moving && state.selFloating) {
      state.selFloating.x = Math.max(0, Math.min(SKIN_W - state.selFloating.w, px - state.selDrag.dx));
      state.selFloating.y = Math.max(0, Math.min(SKIN_H - state.selFloating.h, py - state.selDrag.dy));
      drawSelectionOverlay();
      update3dTexture();
      return;
    }
    if (state.selStart) {
      state.selRect = normalizeRect(state.selStart.x, state.selStart.y, px, py);
      drawSelectionOverlay();
      update3dTexture();
    }
    return;
  }
  if (state.painting && (px !== lastPx || py !== lastPy)) {
    // Interpolate to avoid gaps when moving fast
    const dx = px - lastPx, dy = py - lastPy;
    const steps = Math.max(Math.abs(dx), Math.abs(dy));
    for (let i = 0; i <= steps; i++) {
      const ix = Math.round(lastPx + dx * i / steps);
      const iy = Math.round(lastPy + dy * i / steps);
      paintPixel(ix, iy);
    }
    lastPx = px; lastPy = py;
  }
});

window.addEventListener('mouseup', e => {
  state.painting = false;
  state.panStart  = null;
  if (state.tool === 'select') {
    if (state.selStart) {
      state.selStart = null;
    }
    if (state.selDrag && state.selDrag.moving) {
      state.selDrag = null;
    }
  }
  skinCanvas.style.cursor = state.tool === 'eraser' ? 'cell' : state.tool === 'picker' ? 'crosshair' : 'crosshair';
});

skinCanvas.addEventListener('mouseleave', () => {
  document.getElementById('pixel-pos').textContent = '';
});

// Zoom on scroll
skinCanvas.addEventListener('wheel', e => {
  e.preventDefault();
  if (e.deltaY < 0) zoomIn();
  else zoomOut();
}, { passive: false });

function pickColorFromPixel(px, py) {
  if (px < 0 || py < 0 || px >= SKIN_W || py >= SKIN_H) return;
  const d = pixelCtx.getImageData(px, py, 1, 1).data;
  if (d[3] === 0) return; // transparent — don't pick
  const hex = '#' + [d[0], d[1], d[2]].map(v => v.toString(16).padStart(2, '0')).join('');
  setColor(hex);
  addRecentColor(hex);
}

function zoomOut() { state.zoom = Math.max(state.zoom - (state.zoom <= 4 ? 1 : state.zoom <= 8 ? 2 : 4), 1); updateZoom(); }

}

// Brush size

// File open

  const f = e.target.files[0];
  if (!f) return;
  const url = URL.createObjectURL(f);
  const img = new Image();
  img.onload = () => {
    pushUndo();
    pixelCtx.clearRect(0, 0, SKIN_W, SKIN_H);
    // If 64×64, take top half; if 64×32, use as-is
    if (img.width === 64 && img.height === 32) {
      pixelCtx.drawImage(img, 0, 0, 64, 32, 0, 0, 64, 32);
    } else if (img.width === 64 && img.height === 64) {
      pixelCtx.drawImage(img, 0, 0, 64, 64, 0, 0, SKIN_W, SKIN_H);
    } else {
      // Scale to fit
      pixelCtx.drawImage(img, 0, 0, SKIN_W, SKIN_H);
    }
    redrawSkin();
    update3dTexture();
    document.getElementById('status').textContent = `Loaded: ${f.name} (${img.width}×${img.height})`;
    URL.revokeObjectURL(url);
  };
  img.src = url;
  e.target.value = '';
});

// ── Minecraft skin importer ─────────────────────────────────────────────────
// Converts a standard 64×32 (or 64×64) Minecraft skin PNG into the CNR 64×32
// UV layout and loads it into the editor.
function convertMinecraftSkin(srcImg) {
  // Draw the source image to a temp canvas so we can blit sub-rects
  const src = document.createElement('canvas');
  src.width = srcImg.width; src.height = srcImg.height;
  src.getContext('2d').drawImage(srcImg, 0, 0);

  const dest = document.createElement('canvas');
  dest.width = 64; dest.height = 64;
  const dc = dest.getContext('2d');

  // blit(sx,sy,w,h, dx,dy): copy a rect from the MC skin to the CNR canvas
  function blit(sx, sy, w, h, dx, dy) {
    dc.drawImage(src, sx, sy, w, h, dx, dy, w, h);
  }

  // ── HEAD (6 faces, all 8×8) ──────────────────────────────────────────────
  // MC standard:  front[8,8] right[0,8] left[16,8] back[24,8] top[8,0] bot[16,0]
  // CNR layout:   front[8,0] right[16,0] left[0,0] back[24,0] top[32,0] bot[40,0]
  blit( 8,  8,  8,  8,  8,  0);  // head front
  blitFace( 0,  8,  8,  8, 16,  0, 8, 8, 90);  // head right
  blitFace(16,  8,  8,  8,  0,  0, 8, 8, 270);  // head left
  blit(24,  8,  8,  8, 24,  0);  // head back
  blit( 8,  0,  8,  8, 32,  0);  // head top
  blitFace(16,  0,  8,  8, 40,  0, 8, 8, 180);  // head bottom

  // ── BODY (front/back 8×12, sides 4×12, top 8×4) ─────────────────────────
  // MC: front[20,20] left[28,20] right[16,20] back[32,20] top[20,16]
  // CNR: front[4,8]  left[0,8]  right[12,8]  back[16,8]  top[24,8]
  blit(20, 20,  8, 12,  4,  8);  // body front
  blit(28, 20,  4, 12,  0,  8);  // body left
  blit(16, 20,  4, 12, 12,  8);  // body right
  blit(32, 20,  8, 12, 16,  8);  // body back
  blit(20, 16,  8,  4, 24,  8);  // body top
  blit(28, 16,  8,  4, 24, 12);  // body bottom

  // ── ARM (front/back 4×12, sides 4×12, caps 4×4) ─────────────────────────
  // MC right arm: right[40,20] front[44,20] left[48,20] back[52,20] top[44,16] bot[48,16]
  // CNR arm:      right[8,20]  front[4,20]  left[0,20]  back[12,20] top[16,20] bot[16,24]
  const baseArm = { front:[44,20,4,12], right:[40,20,4,12], left:[48,20,4,12], back:[52,20,4,12], top:[44,16,4,4], bottom:[48,16,4,4] };
  blit(...baseArm.front,   4, 20);  // arm front
  blit(...baseArm.left,    8, 20);  // arm right (outer)
  blit(...baseArm.right,   0, 20);  // arm left (inner)
  blit(...baseArm.back,   12, 20);  // arm back
  blit(...baseArm.top,    16, 20);  // arm top
  blit(...baseArm.bottom, 16, 24);  // arm bottom

  // ── LEGS (shaft only — feet must be painted manually) ────────────────────
  // MC right leg: right[0,20] front[4,20] left[8,20] back[12,20]  (x=0-16)
  // CNR leg shaft (x+20 offset): right[20,20] front[24,20] left[28,20] back[32,20]
  const baseLeg = srcImg.height >= 64
    ? { right:[16,52,4,12], front:[20,52,4,12], left:[24,52,4,12], back:[28,52,4,12] }
    : { right:[0,20,4,12], front:[4,20,4,12], left:[8,20,4,12], back:[12,20,4,12] };
  blit(...baseLeg.right, 20, 20);  // leg right (outer)
  blit(...baseLeg.front, 24, 20);  // leg front
  blit(...baseLeg.left,  28, 20);  // leg left (inner)
  blit(...baseLeg.back,  32, 20);  // leg back

  function blitFace(sx, sy, sw, sh, dx, dy, dw, dh, rot = 0, flipX = false, flipY = false) {
    if (!rot && !flipX && !flipY) {
      dc.drawImage(src, sx, sy, sw, sh, dx, dy, dw, dh);
      return;
    }
    const tmp = document.createElement('canvas');
    tmp.width = (rot === 90 || rot === 270) ? sh : sw;
    tmp.height = (rot === 90 || rot === 270) ? sw : sh;
    const tc = tmp.getContext('2d');
    tc.save();
    if (rot === 90) {
      tc.translate(tmp.width, 0);
      tc.rotate(Math.PI / 2);
    } else if (rot === 180) {
      tc.translate(tmp.width, tmp.height);
      tc.rotate(Math.PI);
    } else if (rot === 270) {
      tc.translate(0, tmp.height);
      tc.rotate(-Math.PI / 2);
    }
    if (flipX || flipY) {
      tc.translate(flipX ? sw : 0, flipY ? sh : 0);
      tc.scale(flipX ? -1 : 1, flipY ? -1 : 1);
    }
    tc.drawImage(src, sx, sy, sw, sh, 0, 0, sw, sh);
    tc.restore();
    dc.drawImage(tmp, dx, dy, dw, dh);
  }

  if (srcImg.height >= 64) {

      hand_right_back:  [52, 36, 4, 12],

      leg_left_back:    [12, 52, 4, 12],

    };
    const overlayDst = {

function convertMinecraftSkinEnemy(srcImg) {
  const src = document.createElement('canvas');
  src.width = srcImg.width; src.height = srcImg.height;
  src.getContext('2d').drawImage(srcImg, 0, 0);

  const dest = document.createElement('canvas');
  dest.width = 64; dest.height = 32;
  const dc = dest.getContext('2d');

  function blitFace(sx, sy, sw, sh, dx, dy, dw, dh, rot = 0) {
    if (!rot) {
      dc.drawImage(src, sx, sy, sw, sh, dx, dy, dw, dh);
      return;
    }
    const tmp = document.createElement('canvas');
    tmp.width = (rot === 90 || rot === 270) ? sh : sw;
    tmp.height = (rot === 90 || rot === 270) ? sw : sh;
    const tc = tmp.getContext('2d');
    if (rot === 90) {
      tc.translate(tmp.width, 0);
      tc.rotate(Math.PI / 2);
    } else if (rot === 180) {
      tc.translate(tmp.width, tmp.height);
      tc.rotate(Math.PI);
    } else if (rot === 270) {
      tc.translate(0, tmp.height);
      tc.rotate(-Math.PI / 2);
    }
    tc.drawImage(src, sx, sy, sw, sh, 0, 0, sw, sh);
    dc.drawImage(tmp, dx, dy, dw, dh);
  }

  const is64 = srcImg.height >= 64;
  const face = {
    head_front:       [ 8,  8, 8,  8],
    head_right:       [ 0,  8, 8,  8],
    head_left:        [16,  8, 8,  8],
    head_back:        [24,  8, 8,  8],
    head_top:         [ 8,  0, 8,  8],
    head_bottom:      [16,  0, 8,  8],
    torso_front:      [20, 20, 8, 12],
    torso_right:      [16, 20, 4, 12],
    torso_left:       [28, 20, 4, 12],
    torso_back:       [32, 20, 8, 12],
    torso_top:        [20, 16, 8,  4],
    torso_bottom:     [28, 16, 8,  4],
    right_arm_front:  [44, 20, 4, 12],
    right_arm_right:  [40, 20, 4, 12],
    right_arm_left:   [48, 20, 4, 12],
    right_arm_back:   [52, 20, 4, 12],
    right_arm_top:    [44, 16, 4,  4],
    right_arm_bottom: [48, 16, 4,  4],
    right_leg_front:  [ 4, 20, 4, 12],
    right_leg_right:  [ 0, 20, 4, 12],
    right_leg_left:   [ 8, 20, 4, 12],
    right_leg_back:   [12, 20, 4, 12],
    right_leg_top:    [ 4, 16, 4,  4],
    right_leg_bottom: [ 8, 16, 4,  4],
  };
  face.left_arm_front  = is64 ? [36, 52, 4, 12] : face.right_arm_front;
  face.left_arm_right  = is64 ? [32, 52, 4, 12] : face.right_arm_right;
  face.left_arm_left   = is64 ? [40, 52, 4, 12] : face.right_arm_left;
  face.left_arm_back   = is64 ? [44, 52, 4, 12] : face.right_arm_back;
  face.left_arm_top    = is64 ? [36, 48, 4,  4] : face.right_arm_top;
  face.left_arm_bottom = is64 ? [40, 48, 4,  4] : face.right_arm_bottom;
  face.left_leg_front  = is64 ? [20, 52, 4, 12] : face.right_leg_front;
  face.left_leg_right  = is64 ? [16, 52, 4, 12] : face.right_leg_right;
  face.left_leg_left   = is64 ? [24, 52, 4, 12] : face.right_leg_left;
  face.left_leg_back   = is64 ? [28, 52, 4, 12] : face.right_leg_back;
  face.left_leg_top    = is64 ? [20, 48, 4,  4] : face.right_leg_top;
  face.left_leg_bottom = is64 ? [24, 48, 4,  4] : face.right_leg_bottom;

  const overlayFace = is64 ? {
    head_front:       [40,  8, 8,  8],
    head_right:       [32,  8, 8,  8],
    head_left:        [48,  8, 8,  8],
    head_back:        [56,  8, 8,  8],
    head_top:         [40,  0, 8,  8],
    head_bottom:      [48,  0, 8,  8],
    torso_front:      [20, 36, 8, 12],
    torso_right:      [16, 36, 4, 12],
    torso_left:       [28, 36, 4, 12],
    torso_back:       [32, 36, 8, 12],
    torso_top:        [20, 32, 8,  4],
    torso_bottom:     [28, 32, 8,  4],
    right_arm_front:  [44, 36, 4, 12],
    right_arm_right:  [40, 36, 4, 12],
    right_arm_left:   [48, 36, 4, 12],
    right_arm_back:   [52, 36, 4, 12],
    right_arm_top:    [44, 32, 4,  4],
    right_arm_bottom: [48, 32, 4,  4],
    right_leg_front:  [ 4, 36, 4, 12],
    right_leg_right:  [ 0, 36, 4, 12],
    right_leg_left:   [ 8, 36, 4, 12],
    right_leg_back:   [12, 36, 4, 12],
    right_leg_top:    [ 4, 32, 4,  4],
    right_leg_bottom: [ 8, 32, 4,  4],
    left_arm_front:   [52, 52, 4, 12],
    left_arm_right:   [48, 52, 4, 12],
    left_arm_left:    [56, 52, 4, 12],
    left_arm_back:    [60, 52, 4, 12],
    left_arm_top:     [52, 48, 4,  4],
    left_arm_bottom:  [56, 48, 4,  4],
    left_leg_front:   [ 4, 52, 4, 12],
    left_leg_right:   [ 0, 52, 4, 12],
    left_leg_left:    [ 8, 52, 4, 12],
    left_leg_back:    [12, 52, 4, 12],
    left_leg_top:     [ 4, 48, 4,  4],
    left_leg_bottom:  [ 8, 48, 4,  4],
  } : null;

  const rotation = {
    head_front: 180, head_right: 180, head_bottom: 90, head_top: 270,
    torso_front: 180, torso_bottom: 90, torso_top: 270,
    left_arm_front: 180, left_arm_right: 180, left_arm_top: 270, left_arm_bottom: 180,
    left_leg_front: 180, left_leg_top: 90, left_leg_bottom: 90,
    right_leg_bottom: 90, right_leg_right: 180, right_leg_front: 180, right_leg_top: 90,
    right_arm_right: 180, right_arm_front: 180, right_arm_bottom: 180, right_arm_top: 270,
  };

  for (const name of ENEMY_FACE_ORDER) {
    if (name === 'blood') continue;
    const srcFace = face[name];
    const dst = ENEMY_BASE_ATLAS[name];
    if (!srcFace || !dst) continue;
    blitFace(srcFace[0], srcFace[1], srcFace[2], srcFace[3], dst[0], dst[1], dst[2], dst[3], rotation[name] || 0);
  }

  if (overlayFace) {
    for (const name of ENEMY_FACE_ORDER) {
      if (name === 'blood') continue;
      const srcFace = overlayFace[name];
      const dst = ENEMY_LAYER_ATLAS[name];
      if (!srcFace || !dst) continue;
      blitFace(srcFace[0], srcFace[1], srcFace[2], srcFace[3], dst[0], dst[1], dst[2], dst[3], rotation[name] || 0);
    }
  }

  return dest;
}

document.getElementById('mc-import-input').addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  const url = URL.createObjectURL(f);
  const img = new Image();
  img.onload = () => {
    if ((img.width !== 64) || (img.height !== 32 && img.height !== 64)) {
      document.getElementById('status').textContent = `Import failed: expected 64×32 or 64×64 PNG, got ${img.width}×${img.height}`;
      URL.revokeObjectURL(url);
      return;
    }
    pushUndo();
    const converted = (activeSkinType === 'enemy')
      ? convertMinecraftSkinEnemy(img)
      : convertMinecraftSkin(img);
    pixelCtx.clearRect(0, 0, SKIN_W, SKIN_H);
    if (activeSkinType === 'enemy') {
      pixelCtx.drawImage(converted, 0, 0, 64, 32, 0, 0, 64, 32);
    } else {
      pixelCtx.drawImage(converted, 0, 0, 64, 64, 0, 0, 64, 64);
    }
    redrawSkin();
    update3dTexture();
    document.getElementById('status').textContent = activeSkinType === 'enemy'
      ? `Imported MC skin as Enemy3 layout: ${f.name}`
      : `Imported MC skin: ${f.name} — feet area is blank, paint manually`;
    URL.revokeObjectURL(url);
  };
  img.src = url;
  e.target.value = '';
});

// Keyboard
window.addEventListener('keydown', e => {
  if (e.ctrlKey && e.key === 'z') { e.preventDefault(); undo(); }
  if (e.ctrlKey && (e.key === 'y' || (e.shiftKey && e.key === 'Z'))) { e.preventDefault(); redo(); }
  if (e.key === 'p' || e.key === 'P') setTool('pencil');
  if (e.key === 'e' || e.key === 'E') setTool('eraser');
  if (e.key === 'b' || e.key === 'B') setTool('bucket');
  if (e.key === 'i' || e.key === 'I') { setTool('picker'); setModelTool('picker'); }
  if (e.key === '[') { state.brushSize = Math.max(1, state.brushSize - 1); document.getElementById('brush-val').textContent = state.brushSize; }
  if (e.key === ']') { state.brushSize = Math.min(16, state.brushSize + 1); document.getElementById('brush-val').textContent = state.brushSize; }
});

function update3dTexture() {
  compositeCtx.clearRect(0, 0, SKIN_W, SKIN_H);

    compositeCtx.drawImage(state.selFloating.canvas, state.selFloating.x, state.selFloating.y);

  liveTexture.image = compositeCanvas;

function remapEnemyAtlasUv(u, v, dstAtlas, partName) {
  const px = u * SKIN_W;
  const py = (1 - v) * SKIN_H;
  const epsilon = 0.03;
  for (const name of ENEMY_FACE_ORDER) {
    if (name === 'blood' && partName !== 'blood') continue;
    if (name !== 'blood' && partName === 'blood') continue;
    const src = ENEMY_OLD_ATLAS[name];
    const dst = dstAtlas[name];
    if (!src || !dst) continue;
    if (px < src[0] - epsilon || px > src[0] + src[2] + epsilon ||
        py < src[1] - epsilon || py > src[1] + src[3] + epsilon) continue;
    const lx = src[2] ? (px - src[0]) / src[2] : 0;
    const ly = src[3] ? (py - src[1]) / src[3] : 0;
    const dx = dst[0] + lx * dst[2];
    const dy = dst[1] + ly * dst[3];
    return { u: dx / SKIN_W, v: 1 - dy / SKIN_H };
  }
  return { u, v };
}

function remapPlayerBaseUv(u, v) {
  return { u, v: 1 - (((1 - v) * 32) / SKIN_H) };
}

function remapPlayerLayerUv(u, v, partName) {
  const py = (1 - v) * 32;
  return { u, v: 1 - ((py + 32) / SKIN_H) };
}

function buildModel(objText) {
  // Clear existing meshes
  while (playerGroup.children.length) playerGroup.remove(playerGroup.children[0]);
  for (const k of Object.keys(partMeshes)) delete partMeshes[k];

  const lines = objText.split('\n');

  // Collect all global vertex data
  const gPos = [], gUV = [], gNrm = [];
  for (const line of lines) {
    const p = line.trimStart().split(/\s+/);
    if      (p[0] === 'v')  gPos.push(+p[1], +p[2], +p[3]);
    else if (p[0] === 'vt') gUV.push(+p[1], +p[2]);
    else if (p[0] === 'vn') gNrm.push(+p[1], +p[2], +p[3]);
  }

  // Compute bounding box to center and normalize the model
  let xMin=1e9,xMax=-1e9,yMin=1e9,yMax=-1e9,zMin=1e9,zMax=-1e9;
  for (let i = 0; i < gPos.length; i += 3) {
    if (gPos[i]   < xMin) xMin=gPos[i];   if (gPos[i]   > xMax) xMax=gPos[i];
    if (gPos[i+1] < yMin) yMin=gPos[i+1]; if (gPos[i+1] > yMax) yMax=gPos[i+1];
    if (gPos[i+2] < zMin) zMin=gPos[i+2]; if (gPos[i+2] > zMax) zMax=gPos[i+2];
  }
  const cx = (xMin+xMax)/2, cy = (yMin+yMax)/2, cz = (zMin+zMax)/2;
  const scl = 2.0 / (yMax - yMin); // normalize to 2 units tall (-1..+1 in Y)
  // Build one BufferGeometry per named group
  let curName = null;
  const groups = {};
  for (const line of lines) {
    const p = line.trimStart().split(/\s+/);
    if (p[0] === 'g') {
      curName = p[1] || 'default';
      if (!groups[curName]) groups[curName] = { pos: [], uv: [], origUv: [], nrm: [] };
    } else if (p[0] === 'f' && curName) {
      const verts = p.slice(1).map(tok => {
        const [vi, ti, ni] = tok.split('/').map(s => parseInt(s) - 1);
        return { vi, ti: isNaN(ti) ? vi : ti, ni: isNaN(ni) ? vi : ni };
      });
      // Fan triangulate (all faces here are already tris, but be safe)
      for (let i = 1; i < verts.length - 1; i++) {
        for (const v of [verts[0], verts[i], verts[i+1]]) {
          const b = v.vi * 3;
          groups[curName].pos.push(
            (gPos[b]   - cx) * scl,
            (gPos[b+1] - cy) * scl,
            (gPos[b+2] - cz) * scl
          );
          const t = v.ti * 2;
          let u = gUV.length > t + 1 ? gUV[t] : 0;
          let vtx = gUV.length > t + 1 ? gUV[t+1] : 0;
          const origU = u;
          const origV = vtx;
          if (activeSkinType === 'enemy') {
            const remapped = remapEnemyAtlasUv(u, vtx, ENEMY_BASE_ATLAS, curName);
            u = remapped.u;
            vtx = remapped.v;
          } else if (activeSkinType === 'player') {
            const remapped = remapPlayerBaseUv(u, vtx);
            u = remapped.u;
            vtx = remapped.v;
          }
          groups[curName].uv.push(u, vtx);
          groups[curName].origUv.push(origU, origV);
          if (gNrm.length) {
            const n = v.ni * 3;
            groups[curName].nrm.push(gNrm.length > n + 2 ? gNrm[n] : 0, gNrm.length > n + 2 ? gNrm[n+1] : 0, gNrm.length > n + 2 ? gNrm[n+2] : 1);
          }
        }
      }
    }
  }

  for (const [name, data] of Object.entries(groups)) {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(data.pos, 3));
    geo.setAttribute('uv',       new THREE.Float32BufferAttribute(data.uv,  2));
    if (data.nrm.length) geo.setAttribute('normal', new THREE.Float32BufferAttribute(data.nrm, 3));
    else geo.computeVertexNormals();
    const mesh = new THREE.Mesh(geo, skinMat);
    mesh.name = name;
    partMeshes[name] = mesh;
    playerGroup.add(mesh);

    if (state.overlay && (activeSkinType === 'enemy' || activeSkinType === 'player') && name !== 'blood') {
      const overlayUv = [];
      for (let i = 0; i + 1 < data.origUv.length; i += 2) {
        if (activeSkinType === 'enemy') {
          const remapped = remapEnemyAtlasUv(data.origUv[i], data.origUv[i + 1], ENEMY_LAYER_ATLAS, name);
          overlayUv.push(remapped.u, remapped.v);
        } else {
          const remapped = remapPlayerLayerUv(data.origUv[i], data.origUv[i + 1], name);
          overlayUv.push(remapped.u, remapped.v);
        }
      }
      const overlayGeo = new THREE.BufferGeometry();
      overlayGeo.setAttribute('position', new THREE.Float32BufferAttribute(data.pos, 3));
      overlayGeo.setAttribute('uv',       new THREE.Float32BufferAttribute(overlayUv, 2));
      if (data.nrm.length) overlayGeo.setAttribute('normal', new THREE.Float32BufferAttribute(data.nrm, 3));
      else overlayGeo.computeVertexNormals();
      const overlayMat = skinMat.clone();
      overlayMat.polygonOffset = true;
      overlayMat.polygonOffsetFactor = -1;
      overlayMat.polygonOffsetUnits = -1;
      overlayMat.depthTest = true;
      overlayMat.depthWrite = false;
      overlayMat.transparent = false;
      overlayMat.side = THREE.FrontSide;
      overlayMat.alphaTest = skinMat.alphaTest;
      const overlayMesh = new THREE.Mesh(overlayGeo, overlayMat);
      overlayMesh.name = `${name}_layer`;
      overlayMesh.scale.setScalar(activeSkinType === 'enemy' ? 1.04 : 1.01);
      overlayMesh.renderOrder = 1;
      playerGroup.add(overlayMesh);
    }
  }
  buildPartsUI();
}

buildModel(CHARACTER_OBJ);
document.getElementById('btn-toggle-overlay').addEventListener('click', () => {
  state.overlay = !state.overlay;
  document.getElementById('btn-toggle-overlay').textContent = state.overlay ? 'Overlay: On' : 'Overlay: Off';
  buildModel((activeSkinType === 'enemy') ? getEnemyObjText() : CHARACTER_OBJ);
});

// ─── Preview resize ───────────────────────────────────────────────────────────

function resizePreview() {
  const panel = document.getElementById('right-panel');
  const h3    = panel.querySelector('h3');
  const w = panel.clientWidth;
  const h = panel.clientHeight - h3.offsetHeight;
  prevRenderer.setSize(w, h);
  prevCamera.aspect = w / h;
  prevCamera.updateProjectionMatrix();
}

new ResizeObserver(resizePreview).observe(document.getElementById('right-panel'));
resizePreview();

// ─── Animation loop ───────────────────────────────────────────────────────────

function animate() {
  requestAnimationFrame(animate);
  orbitPrev.update();
  prevRenderer.render(prevScene, prevCamera);
}
animate();

// ─── Initial canvas size ─────────────────────────────────────────────────────

window.addEventListener('resize', resizeCanvases);
resizeCanvases();

// Position overlay canvas over skin canvas
function positionOverlay() {
  const sc  = skinCanvas;
  const ov  = overlayCanvas;
  const wrap = document.getElementById('canvas-wrap');
  ov.style.position = 'absolute';
  ov.style.left = sc.offsetLeft + 'px';
  ov.style.top  = sc.offsetTop  + 'px';
}
new ResizeObserver(() => { resizeCanvases(); positionOverlay(); }).observe(document.getElementById('canvas-wrap'));

// ─── Mode switching ───────────────────────────────────────────────────────────

function switchMode(mode) {
  appMode = mode;
  document.body.classList.toggle('uv-mode',    mode === 'uv');
  document.body.classList.toggle('model-mode', mode === 'model');
  document.getElementById('tab-uv').classList.toggle('active',    mode === 'uv');
  document.getElementById('tab-model').classList.toggle('active', mode === 'model');
  document.getElementById('panel-3d-title').textContent =
    mode === 'uv' ? '3D Preview — drag to rotate' : '3D Model Editor — right-drag to rotate';
  if (mode === 'model') {
    orbitPrev.mouseButtons = { LEFT: null, MIDDLE: THREE.MOUSE.PAN, RIGHT: THREE.MOUSE.ROTATE };
    previewCanvas.style.cursor = (modelTool === 'paint' || modelTool === 'picker') ? 'crosshair' : modelTool === 'bucket' ? 'copy' : 'default';
  } else {
    orbitPrev.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.PAN };
    previewCanvas.style.cursor = '';
  }
  setTimeout(resizePreview, 0);
}

document.getElementById('tab-uv').addEventListener('click',    () => switchMode('uv'));
document.getElementById('tab-model').addEventListener('click', () => switchMode('model'));

// ─── Model tools ─────────────────────────────────────────────────────────────

function setModelTool(t) {
  modelTool = t;
  document.querySelectorAll('.model-tool-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.tool === t)
  );
  if (appMode === 'model') previewCanvas.style.cursor = (t === 'paint' || t === 'picker') ? 'crosshair' : t === 'bucket' ? 'copy' : 'default';
}

document.querySelectorAll('.model-tool-btn').forEach(b =>
  b.addEventListener('click', () => setModelTool(b.dataset.tool))
);

// ─── Part visibility ─────────────────────────────────────────────────────────

function buildPartsUI() {
  const list = document.getElementById('parts-list');
  if (!list) return;
  list.innerHTML = '';
  const ORDER  = ['head', 'trunk', 'hand_left', 'hand_right', 'leg_left', 'leg_right',
                   'hat', 'legleft', 'legright', 'handleft', 'handright'];
  const LABELS = {
    head: 'Head', trunk: 'Torso',
    hand_left: 'Arm L', hand_right: 'Arm R',
    leg_left: 'Leg L', leg_right: 'Leg R',
    hat: 'Hat', legleft: 'Leg L', legright: 'Leg R', handleft: 'Arm L', handright: 'Arm R',
  };
  const names  = ORDER.filter(n => partMeshes[n]).concat(Object.keys(partMeshes).filter(n => !ORDER.includes(n)));
  for (const name of names) {
    const row = document.createElement('div');
    row.className = 'part-row';
    row.dataset.part = name;

    const eye = document.createElement('button');
    eye.className = 'part-eye';
    eye.textContent = '👁';
    eye.title = 'Toggle visibility';
    eye.style.opacity = '1';
    eye.addEventListener('click', e => {
      e.stopPropagation();
      const mesh = partMeshes[name];
      mesh.visible = !mesh.visible;
      eye.style.opacity = mesh.visible ? '1' : '0.3';
    });

    const label = document.createElement('span');
    label.className = 'part-label';
    label.textContent = LABELS[name] || name;

    const iso = document.createElement('button');
    iso.className = 'part-isolate';
    iso.textContent = 'iso';
    iso.title = 'Show only this part';
    iso.addEventListener('click', e => { e.stopPropagation(); isolatePart(name); });

    row.appendChild(eye);
    row.appendChild(label);
    row.appendChild(iso);
    row.addEventListener('click', () => selectPart(name));
    list.appendChild(row);
  }
}

function selectPart(name) {
  selectedPart = name;
  document.querySelectorAll('.part-row').forEach(r =>
    r.classList.toggle('selected', r.dataset.part === name)
  );
}

function isolatePart(name) {
  for (const [n, mesh] of Object.entries(partMeshes)) mesh.visible = (n === name);
  document.querySelectorAll('.part-row').forEach(r => {
    const eye = r.querySelector('.part-eye');
    if (eye) eye.style.opacity = partMeshes[r.dataset.part]?.visible ? '1' : '0.3';
  });
  selectPart(name);
}

document.getElementById('btn-show-all')?.addEventListener('click', () => {
  for (const mesh of Object.values(partMeshes)) mesh.visible = true;
  document.querySelectorAll('.part-row .part-eye').forEach(e => { e.style.opacity = '1'; });
});

// ─── Model paint & select (raycaster) ────────────────────────────────────────

const raycaster = new THREE.Raycaster();
let modelPainting = false;

function getVisibleModelMeshes() {
  return Object.values(partMeshes).filter(m => m.visible);
}

function getIsolatedModelPartName() {
  const visible = getVisibleModelMeshes();
  return visible.length === 1 ? visible[0].name : null;
}

function hitAllowedForCurrentModelState(hit) {
  const isolated = getIsolatedModelPartName();
  return !isolated || hit.object.name === isolated;
}

function getModelHit(clientX, clientY) {
  const rect = previewCanvas.getBoundingClientRect();
  const ndcX =  ((clientX - rect.left) / rect.width)  * 2 - 1;
  const ndcY = -((clientY - rect.top)  / rect.height) * 2 + 1;
  raycaster.setFromCamera(new THREE.Vector2(ndcX, ndcY), prevCamera);
  const hits = raycaster.intersectObjects(getVisibleModelMeshes(), false);
  return hits.length ? hits[0] : null;
}

function paintHitOnTexture(hit) {
  if (!hit || !hit.uv || !hitAllowedForCurrentModelState(hit)) return;
  const px = Math.floor(hit.uv.x * SKIN_W);
  const py = Math.floor((1 - hit.uv.y) * SKIN_H);
  paintPixelMode(px, py, 'paint', state.color);
}

function pointInTriangle(px, py, ax, ay, bx, by, cx, cy) {
  const v0x = cx - ax, v0y = cy - ay;
  const v1x = bx - ax, v1y = by - ay;
  const v2x = px - ax, v2y = py - ay;
  const dot00 = v0x * v0x + v0y * v0y;
  const dot01 = v0x * v1x + v0y * v1y;
  const dot02 = v0x * v2x + v0y * v2y;
  const dot11 = v1x * v1x + v1y * v1y;
  const dot12 = v1x * v2x + v1y * v2y;
  const denom = dot00 * dot11 - dot01 * dot01;
  if (!denom) return false;
  const inv = 1 / denom;
  const u = (dot11 * dot02 - dot01 * dot12) * inv;
  const v = (dot00 * dot12 - dot01 * dot02) * inv;
  return u >= 0 && v >= 0 && (u + v) <= 1;
}

function fillTriangleUV(u0, v0, u1, v1, u2, v2) {
  const x0 = u0 * SKIN_W, y0 = (1 - v0) * SKIN_H;
  const x1 = u1 * SKIN_W, y1 = (1 - v1) * SKIN_H;
  const x2 = u2 * SKIN_W, y2 = (1 - v2) * SKIN_H;
  const minX = Math.max(0, Math.floor(Math.min(x0, x1, x2)));
  const maxX = Math.min(SKIN_W - 1, Math.ceil(Math.max(x0, x1, x2)));
  const minY = Math.max(0, Math.floor(Math.min(y0, y1, y2)));
  const maxY = Math.min(SKIN_H - 1, Math.ceil(Math.max(y0, y1, y2)));
  for (let py = minY; py <= maxY; py++) {
    for (let px = minX; px <= maxX; px++) {
      if (pointInTriangle(px + 0.5, py + 0.5, x0, y0, x1, y1, x2, y2)) {
        pixelCtx.fillStyle = state.color;
        pixelCtx.fillRect(px, py, 1, 1);
      }
    }
  }
}

function fillPartSurface(mesh) {
  if (!mesh || !mesh.geometry) return;
  if (!hitAllowedForCurrentModelState({ object: mesh })) return;
  const uvAttr = mesh.geometry.getAttribute('uv');
  if (!uvAttr) return;
  const uvs = uvAttr.array;
  for (let i = 0; i + 5 < uvs.length; i += 6) {
    fillTriangleUV(uvs[i], uvs[i + 1], uvs[i + 2], uvs[i + 3], uvs[i + 4], uvs[i + 5]);
  }
  redrawSkin();
  update3dTexture();
}

function paintOnModel(clientX, clientY) {
  const hit = getModelHit(clientX, clientY);
  if (!hit || !hit.uv) return;
  paintHitOnTexture(hit);
}

previewCanvas.addEventListener('contextmenu', e => e.preventDefault());

previewCanvas.addEventListener('mousedown', e => {
  if (appMode !== 'model' || e.button !== 0) return;
  const hit = getModelHit(e.clientX, e.clientY);
  if (modelTool === 'picker') {
    if (hit && hit.uv && hitAllowedForCurrentModelState(hit)) {
      const px = Math.floor(hit.uv.x * SKIN_W);
      const py = Math.floor((1 - hit.uv.y) * SKIN_H);
      pickColorFromPixel(px, py);
    }
    return;
  } else if (modelTool === 'paint') {
    pushUndo();
    addRecentColor(state.color);
    modelPainting = true;
    paintHitOnTexture(hit);
  } else if (modelTool === 'bucket') {
    if (hit && hitAllowedForCurrentModelState(hit)) {
      pushUndo();
      addRecentColor(state.color);
      fillPartSurface(hit.object);
    }
  } else if (modelTool === 'select' && hit) {
    selectPart(hit.object.name);
  }
});

previewCanvas.addEventListener('mousemove', e => {
  if (appMode !== 'model' || modelTool !== 'paint' || !modelPainting) return;
  paintOnModel(e.clientX, e.clientY);
});

window.addEventListener('mouseup', () => { modelPainting = false; });

// ─── Skin type switching ──────────────────────────────────────────────────────

const PLAYER_LEGEND_HTML = buildLegendHtml(PLAYER_UV_PARTS);
const ENEMY_LEGEND_HTML  = buildLegendHtml(ENEMY_UV_PARTS);

function switchSkinType(type) {
  activeSkinType = type;
  activeUVParts  = (type === 'enemy') ? ENEMY_UV_PARTS : PLAYER_UV_PARTS;

  document.getElementById('btn-skin-player').classList.toggle('active', type === 'player');
  document.getElementById('btn-skin-enemy').classList.toggle('active',  type === 'enemy');

  const legend = document.getElementById('parts-legend');
  if (legend) legend.innerHTML = (type === 'enemy') ? ENEMY_LEGEND_HTML : PLAYER_LEGEND_HTML;

  buildModel((type === 'enemy') ? getEnemyObjText() : CHARACTER_OBJ);
  redrawOverlay();
}

document.getElementById('btn-skin-player').addEventListener('click', () => switchSkinType('player'));
document.getElementById('btn-skin-enemy').addEventListener('click',  () => switchSkinType('enemy'));

document.getElementById('enemy-obj-input').addEventListener('change', async e => {
  const f = e.target.files[0];
  if (!f) return;
  try {
    const text = (await f.text()).replace(/\r\n/g, '\n');
    if (!text || !/(^|\n)v\s+/m.test(text)) {
      document.getElementById('status').textContent = `Enemy OBJ load failed: ${f.name} does not look like a valid OBJ`;
      return;
    }
    customEnemyObjText = text;
    document.getElementById('status').textContent = `Loaded Enemy OBJ: ${f.name}`;
    switchSkinType('enemy');
    switchMode('model');
  } catch (err) {
    document.getElementById('status').textContent = `Enemy OBJ load failed: ${err.message || err}`;
  } finally {
    e.target.value = '';
  }
});

document.getElementById('btn-enemy-obj-reset').addEventListener('click', () => {
  customEnemyObjText = null;
  document.getElementById('status').textContent = 'Enemy OBJ reset to the built-in placeholder mesh';
  switchSkinType('enemy');
  switchMode('model');
});

// ─── Init ─────────────────────────────────────────────────────────────────────

switchMode('uv');

</script>

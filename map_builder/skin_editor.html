<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CNR Skin Editor</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #12121e; color: #dde; font-family: 'Segoe UI', sans-serif; font-size: 13px; display: flex; flex-direction: column; height: 100vh; overflow: hidden; user-select: none; }

/* ── Toolbar ── */
#toolbar { display: flex; align-items: center; gap: 6px; padding: 5px 10px; background: #1a1a2e; border-bottom: 1px solid #252545; flex-shrink: 0; flex-wrap: wrap; }
#toolbar h1 { font-size: 13px; color: #e94560; margin-right: 4px; white-space: nowrap; }
.sep { width: 1px; background: #252545; align-self: stretch; margin: 0 2px; }
.btn { padding: 4px 10px; border: 1px solid #333360; background: #1a1a2e; color: #dde; border-radius: 4px; cursor: pointer; font-size: 12px; white-space: nowrap; }
.btn:hover { background: #252545; }
.btn.active { background: #e94560; color: #fff; border-color: #e94560; }
.btn.green { background: #1a3a22; border-color: #2d6a4f; }
.btn.green:hover { background: #2d6a4f; }
.file-btn { position: relative; overflow: hidden; }
.file-btn input[type=file] { position: absolute; opacity: 0; inset: 0; cursor: pointer; }

/* ── Main ── */
#main { display: flex; flex: 1; overflow: hidden; }

/* ── Left panel ── */
#left-panel { width: 180px; background: #1a1a2e; border-right: 1px solid #252545; display: flex; flex-direction: column; gap: 0; flex-shrink: 0; overflow-y: auto; }
.panel-section { padding: 10px; border-bottom: 1px solid #252545; }
.panel-section h3 { font-size: 10px; text-transform: uppercase; color: #666688; margin-bottom: 8px; letter-spacing: 1px; }

/* Tools */
.tool-btn { display: flex; align-items: center; gap: 7px; width: 100%; padding: 6px 8px; margin-bottom: 4px; background: #12121e; border: 1px solid #333360; border-radius: 4px; cursor: pointer; font-size: 12px; color: #dde; }
.tool-btn:hover { background: #252545; }
.tool-btn.active { background: #e94560; border-color: #e94560; color: #fff; }

/* Color picker area */
#color-preview { width: 100%; height: 32px; border-radius: 4px; border: 2px solid #333360; margin-bottom: 6px; cursor: pointer; }
#color-hex { width: 100%; background: #12121e; border: 1px solid #333360; border-radius: 3px; color: #dde; padding: 4px 7px; font-size: 12px; font-family: monospace; outline: none; margin-bottom: 4px; }
#color-hex:focus { border-color: #e94560; }
#color-native { width: 32px; height: 26px; border: 1px solid #333360; border-radius: 3px; cursor: pointer; padding: 1px; vertical-align: middle; background: #12121e; }
#color-row { display: flex; align-items: center; gap: 6px; }
#color-row span { font-size: 11px; color: #666688; }

/* Recent colors */
#recent-colors { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.swatch { width: 20px; height: 20px; border-radius: 3px; border: 1px solid #333360; cursor: pointer; flex-shrink: 0; }
.swatch:hover { border-color: #dde; }

/* Zoom */
#zoom-val { font-size: 12px; color: #aaaacc; min-width: 32px; text-align: center; }

/* ── Center: 2D canvas ── */
#canvas-wrap { flex: 1; position: relative; overflow: hidden; background: #0e0e1a; display: flex; align-items: center; justify-content: center; }
#skin-canvas { image-rendering: pixelated; cursor: crosshair; display: block; }
#overlay-canvas { position: absolute; pointer-events: none; image-rendering: pixelated; }

/* ── Right: 3D preview ── */
#right-panel { width: 300px; background: #1a1a2e; border-left: 1px solid #252545; display: flex; flex-direction: column; flex-shrink: 0; overflow: hidden; }
#right-panel h3 { font-size: 10px; text-transform: uppercase; color: #666688; letter-spacing: 1px; padding: 10px 10px 6px; border-bottom: 1px solid #252545; flex-shrink: 0; }
#preview-canvas { flex: 1; display: block; width: 100%; }

/* ── Bottom bar ── */
#bottom-bar { display: flex; align-items: center; gap: 8px; padding: 4px 10px; background: #1a1a2e; border-top: 1px solid #252545; flex-shrink: 0; }
#status { font-size: 11px; color: #666688; flex: 1; }
#pixel-pos { font-size: 11px; color: #8888aa; font-family: monospace; }

/* Scrollbar */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: #12121e; }
::-webkit-scrollbar-thumb { background: #333360; border-radius: 3px; }

/* ── Mode tabs ── */
.mode-tab { padding: 4px 12px; border: 1px solid #333360; background: #12121e; color: #8888aa; border-radius: 4px; cursor: pointer; font-size: 12px; white-space: nowrap; }
.mode-tab.active { background: #e94560; color: #fff; border-color: #e94560; }

/* ── Model mode layout ── */
body.model-mode #canvas-wrap { display: none !important; }
body.model-mode #right-panel { flex: 1; width: auto; border-left: none; }
body.uv-mode .model-only { display: none !important; }
body.model-mode .uv-only { display: none !important; }

/* ── Parts list (model mode) ── */
.part-row { display: flex; align-items: center; gap: 5px; padding: 4px 6px; cursor: pointer; border-radius: 3px; }
.part-row:hover { background: #252545; }
.part-row.selected .part-label { color: #e94560; }
.part-eye { background: none; border: none; cursor: pointer; font-size: 13px; line-height: 1; padding: 0; flex-shrink: 0; }
.part-label { font-size: 12px; flex: 1; }
.part-isolate { background: none; border: 1px solid #333360; border-radius: 3px; cursor: pointer; font-size: 10px; color: #666688; padding: 1px 5px; flex-shrink: 0; }
.part-isolate:hover { color: #dde; border-color: #8888aa; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<div id="toolbar">
  <h1>◈ CNR Skin Editor</h1>
  <div class="sep"></div>
  <button class="mode-tab active" id="tab-uv">✏ UV Editor</button>
  <button class="mode-tab" id="tab-model">🎲 Model Editor</button>
  <div class="sep"></div>
  <label class="btn file-btn" title="Open a PNG skin file">
    📂 Open PNG
    <input type="file" id="file-input" accept=".png,image/png">
  </label>
  <label class="btn file-btn" title="Convert a standard Minecraft skin (64×32 or 64×64) to CNR format" style="background:#2a3a5c">
    🎮 Import MC Skin
    <input type="file" id="mc-import-input" accept=".png,image/png">
  </label>
  <button class="btn green" id="btn-export" title="Download as PNG">⬇ Save PNG</button>
  <div class="sep"></div>
  <span style="font-size:11px;color:#666688">Zoom:</span>
  <button class="btn" id="btn-zoom-out">−</button>
  <span id="zoom-val">8×</span>
  <button class="btn" id="btn-zoom-in">+</button>
  <div class="sep"></div>
  <button class="btn" id="btn-undo" title="Undo (Ctrl+Z)">↩ Undo</button>
  <button class="btn" id="btn-redo" title="Redo (Ctrl+Y)">↪ Redo</button>
  <div class="sep uv-only"></div>
  <span class="uv-only" style="font-size:11px;color:#666688">UV grid:</span>
  <button class="btn active uv-only" id="btn-uvgrid" title="Toggle UV part outlines">⊞ Parts</button>
</div>

<div id="main">

  <!-- LEFT -->
  <div id="left-panel">
    <div class="panel-section uv-only">
      <h3>Tools</h3>
      <button class="tool-btn active" id="tool-pencil" data-tool="pencil">✏ Pencil</button>
      <button class="tool-btn" id="tool-eraser" data-tool="eraser">◻ Eraser</button>
      <button class="tool-btn" id="tool-picker" data-tool="picker">🔬 Picker</button>
    </div>
    <div class="panel-section">
      <h3>Color</h3>
      <div id="color-preview" title="Click to open color picker"></div>
      <div id="color-row">
        <span>#</span>
        <input id="color-hex" type="text" maxlength="6" value="ff0000" spellcheck="false">
        <input id="color-native" type="color" value="#ff0000" title="Pick color">
      </div>
      <div id="recent-colors"></div>
    </div>
    <div class="panel-section">
      <h3>Brush size</h3>
      <div style="display:flex;align-items:center;gap:6px">
        <button class="btn" id="btn-brush-dec">−</button>
        <span id="brush-val" style="font-size:12px;color:#aaaacc;min-width:24px;text-align:center">1</span>
        <button class="btn" id="btn-brush-inc">+</button>
        <span style="font-size:11px;color:#666688">px</span>
      </div>
    </div>
    <div class="panel-section uv-only">
      <h3>Parts</h3>
      <div style="font-size:11px;color:#666688;line-height:1.7">
        <div><span style="color:#ff4444">■</span> Head</div>
        <div><span style="color:#ff4444;opacity:.5">■</span> Hat / overlay</div>
        <div><span style="color:#44ff44">■</span> Body</div>
        <div><span style="color:#4488ff">■</span> Right arm</div>
        <div><span style="color:#44ffff">■</span> Left arm</div>
        <div><span style="color:#ffaa00">■</span> Right leg</div>
        <div><span style="color:#ff66ff">■</span> Left leg</div>
      </div>
    </div>
    <div class="panel-section model-only">
      <h3>Model Tools</h3>
      <button class="tool-btn model-tool-btn active" data-tool="select">⬚ Select</button>
      <button class="tool-btn model-tool-btn" data-tool="paint">✏ Paint</button>
      <button class="tool-btn model-tool-btn" data-tool="picker">🔬 Picker</button>
    </div>
    <div class="panel-section model-only">
      <h3>Parts</h3>
      <div id="parts-list"></div>
      <button class="btn" id="btn-show-all" style="width:100%;margin-top:6px;font-size:11px">Show All</button>
    </div>
  </div>

  <!-- CENTER: 2D canvas -->
  <div id="canvas-wrap">
    <canvas id="skin-canvas"></canvas>
    <canvas id="overlay-canvas"></canvas>
  </div>

  <!-- RIGHT: 3D preview -->
  <div id="right-panel">
    <h3 id="panel-3d-title">3D Preview — drag to rotate</h3>
    <canvas id="preview-canvas"></canvas>
  </div>

</div>

<div id="bottom-bar">
  <span id="status">Open a 64×32 or 64×64 PNG skin to start painting.</span>
  <span id="pixel-pos"></span>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ─── Constants ────────────────────────────────────────────────────────────────

const SKIN_W = 64, SKIN_H = 32;  // CNR skin format

// UV regions on a 64×32 texture (pixel coords, y=0 at top)
// [label, x0, y0, x1, y1, css color]
const UV_PARTS = [
  ['Head',     0,  0, 32, 16, 'rgba(255,68,68,0.55)'],
  ['Hat',     32,  0, 64, 16, 'rgba(255,68,68,0.25)'],
  ['Body',    16, 16, 40, 32, 'rgba(68,255,68,0.45)'],
  ['R Arm',   40, 16, 56, 32, 'rgba(68,136,255,0.45)'],
  ['L Arm',   40, 16, 56, 32, 'rgba(68,255,255,0.35)'],  // same region, mirrored in-game
  ['R Leg',    0, 16, 16, 32, 'rgba(255,170,0,0.45)'],
  ['L Leg',    0, 16, 16, 32, 'rgba(255,102,255,0.35)'],  // same region, mirrored in-game
];

// ─── State ────────────────────────────────────────────────────────────────────

const state = {
  tool:      'pencil',
  color:     '#ff0000',
  brushSize: 1,
  zoom:      8,
  uvGrid:    true,
  painting:  false,
  recentColors: [],
  undoStack: [],
  redoStack: [],
  panOffset: { x: 0, y: 0 },
  panStart:  null,
};

// ─── Canvas setup ─────────────────────────────────────────────────────────────

const skinCanvas    = document.getElementById('skin-canvas');
const skinCtx       = skinCanvas.getContext('2d');
const overlayCanvas = document.getElementById('overlay-canvas');
const overlayCtx    = overlayCanvas.getContext('2d');

// The actual pixel data lives here (SKIN_W × SKIN_H)
const pixelCanvas = document.createElement('canvas');
pixelCanvas.width  = SKIN_W;
pixelCanvas.height = SKIN_H;
const pixelCtx = pixelCanvas.getContext('2d');

// Initialise to transparent checkerboard-visible state (transparent black)
pixelCtx.clearRect(0, 0, SKIN_W, SKIN_H);

function getZoomedSize() {
  return { w: SKIN_W * state.zoom, h: SKIN_H * state.zoom };
}

function resizeCanvases() {
  const { w, h } = getZoomedSize();
  skinCanvas.width  = w;
  skinCanvas.height = h;
  skinCanvas.style.width  = w + 'px';
  skinCanvas.style.height = h + 'px';
  overlayCanvas.width  = w;
  overlayCanvas.height = h;
  overlayCanvas.style.width  = w + 'px';
  overlayCanvas.style.height = h + 'px';
  // Position overlay on top of skin canvas
  const wrap = document.getElementById('canvas-wrap');
  const sc   = skinCanvas.getBoundingClientRect();
  // overlay is absolute — let CSS handle it with transform matching
  redrawSkin();
  redrawOverlay();
}

function redrawSkin() {
  const { w, h } = getZoomedSize();
  skinCtx.clearRect(0, 0, w, h);

  // Checkerboard background
  const cs = state.zoom < 4 ? 4 : state.zoom;
  for (let y = 0; y < SKIN_H; y++) {
    for (let x = 0; x < SKIN_W; x++) {
      skinCtx.fillStyle = ((x + y) & 1) ? '#2a2a3e' : '#1e1e30';
      skinCtx.fillRect(x * state.zoom, y * state.zoom, state.zoom, state.zoom);
    }
  }

  // Draw pixels (nearest-neighbour)
  skinCtx.imageSmoothingEnabled = false;
  skinCtx.drawImage(pixelCanvas, 0, 0, w, h);
}

function redrawOverlay() {
  const { w, h } = getZoomedSize();
  overlayCtx.clearRect(0, 0, w, h);

  if (!state.uvGrid) return;

  // Draw UV part regions
  const z = state.zoom;
  for (const [label, x0, y0, x1, y1, col] of UV_PARTS) {
    overlayCtx.strokeStyle = col.replace(/[\d.]+\)$/, '0.85)');
    overlayCtx.lineWidth   = 1;
    overlayCtx.strokeRect(x0 * z + 0.5, y0 * z + 0.5, (x1 - x0) * z - 1, (y1 - y0) * z - 1);
  }

  // Grid lines (only when zoom >= 4)
  if (state.zoom >= 4) {
    overlayCtx.strokeStyle = 'rgba(255,255,255,0.06)';
    overlayCtx.lineWidth = 0.5;
    for (let x = 0; x <= SKIN_W; x++) {
      overlayCtx.beginPath();
      overlayCtx.moveTo(x * z, 0);
      overlayCtx.lineTo(x * z, h);
      overlayCtx.stroke();
    }
    for (let y = 0; y <= SKIN_H; y++) {
      overlayCtx.beginPath();
      overlayCtx.moveTo(0, y * z);
      overlayCtx.lineTo(w, y * z);
      overlayCtx.stroke();
    }
  }
}

// ─── Pixel paint ─────────────────────────────────────────────────────────────

function canvasToPixel(cx, cy) {
  const rect = skinCanvas.getBoundingClientRect();
  const lx   = cx - rect.left;
  const ly   = cy - rect.top;
  return {
    px: Math.floor(lx / state.zoom),
    py: Math.floor(ly / state.zoom),
  };
}

function paintPixel(px, py) {
  if (px < 0 || py < 0 || px >= SKIN_W || py >= SKIN_H) return;
  const b = state.brushSize;
  const half = Math.floor(b / 2);
  for (let dy = -half; dy < b - half; dy++) {
    for (let dx = -half; dx < b - half; dx++) {
      const nx = px + dx, ny = py + dy;
      if (nx < 0 || ny < 0 || nx >= SKIN_W || ny >= SKIN_H) continue;
      if (state.tool === 'eraser') {
        pixelCtx.clearRect(nx, ny, 1, 1);
      } else {
        pixelCtx.fillStyle = state.color;
        pixelCtx.fillRect(nx, ny, 1, 1);
      }
    }
  }
  redrawSkin();
  update3dTexture();
}

// ─── Undo / Redo ─────────────────────────────────────────────────────────────

function captureSnapshot() {
  return pixelCtx.getImageData(0, 0, SKIN_W, SKIN_H);
}

function pushUndo() {
  state.undoStack.push(captureSnapshot());
  if (state.undoStack.length > 60) state.undoStack.shift();
  state.redoStack.length = 0;
}

function undo() {
  if (!state.undoStack.length) return;
  state.redoStack.push(captureSnapshot());
  const snap = state.undoStack.pop();
  pixelCtx.putImageData(snap, 0, 0);
  redrawSkin();
  update3dTexture();
}

function redo() {
  if (!state.redoStack.length) return;
  state.undoStack.push(captureSnapshot());
  const snap = state.redoStack.pop();
  pixelCtx.putImageData(snap, 0, 0);
  redrawSkin();
  update3dTexture();
}

// ─── Color management ────────────────────────────────────────────────────────

function setColor(hex) {
  if (!/^#?[0-9a-fA-F]{6}$/.test(hex)) return;
  if (!hex.startsWith('#')) hex = '#' + hex;
  state.color = hex;
  document.getElementById('color-preview').style.background = hex;
  document.getElementById('color-hex').value = hex.slice(1).toUpperCase();
  document.getElementById('color-native').value = hex;
}

function addRecentColor(hex) {
  state.recentColors = [hex, ...state.recentColors.filter(c => c !== hex)].slice(0, 16);
  renderRecentColors();
}

function renderRecentColors() {
  const el = document.getElementById('recent-colors');
  el.innerHTML = '';
  for (const c of state.recentColors) {
    const s = document.createElement('div');
    s.className = 'swatch';
    s.style.background = c;
    s.title = c;
    s.addEventListener('click', () => setColor(c));
    el.appendChild(s);
  }
}

// Init color
setColor('#ff6655');

// ─── Mouse events (paint) ────────────────────────────────────────────────────

let lastPx = -1, lastPy = -1;

skinCanvas.addEventListener('mousedown', e => {
  if (e.button === 1) { // Middle button pan
    state.panStart = { mx: e.clientX, my: e.clientY };
    e.preventDefault();
    return;
  }
  if (e.button !== 0) return;
  const { px, py } = canvasToPixel(e.clientX, e.clientY);
  if (state.tool === 'picker') {
    pickColorFromPixel(px, py);
    return;
  }
  pushUndo();
  if (state.tool === 'pencil') addRecentColor(state.color);
  state.painting = true;
  lastPx = px; lastPy = py;
  paintPixel(px, py);
});

skinCanvas.addEventListener('mousemove', e => {
  const { px, py } = canvasToPixel(e.clientX, e.clientY);
  document.getElementById('pixel-pos').textContent = `(${px}, ${py})`;
  if (state.painting && (px !== lastPx || py !== lastPy)) {
    // Interpolate to avoid gaps when moving fast
    const dx = px - lastPx, dy = py - lastPy;
    const steps = Math.max(Math.abs(dx), Math.abs(dy));
    for (let i = 0; i <= steps; i++) {
      const ix = Math.round(lastPx + dx * i / steps);
      const iy = Math.round(lastPy + dy * i / steps);
      paintPixel(ix, iy);
    }
    lastPx = px; lastPy = py;
  }
});

window.addEventListener('mouseup', e => {
  state.painting = false;
  state.panStart  = null;
});

skinCanvas.addEventListener('mouseleave', () => {
  document.getElementById('pixel-pos').textContent = '';
});

// Zoom on scroll
skinCanvas.addEventListener('wheel', e => {
  e.preventDefault();
  if (e.deltaY < 0) zoomIn();
  else zoomOut();
}, { passive: false });

// ─── Toolbar actions ─────────────────────────────────────────────────────────

function setTool(t) {
  state.tool = t;
  document.querySelectorAll('.tool-btn').forEach(b => b.classList.toggle('active', b.dataset.tool === t));
  skinCanvas.style.cursor = t === 'eraser' ? 'cell' : t === 'picker' ? 'crosshair' : 'crosshair';
}

function pickColorFromPixel(px, py) {
  if (px < 0 || py < 0 || px >= SKIN_W || py >= SKIN_H) return;
  const d = pixelCtx.getImageData(px, py, 1, 1).data;
  if (d[3] === 0) return; // transparent — don't pick
  const hex = '#' + [d[0], d[1], d[2]].map(v => v.toString(16).padStart(2, '0')).join('');
  setColor(hex);
  addRecentColor(hex);
}
document.querySelectorAll('.tool-btn').forEach(b => b.addEventListener('click', () => setTool(b.dataset.tool)));

function zoomIn()  { state.zoom = Math.min(state.zoom + (state.zoom < 4 ? 1 : state.zoom < 8 ? 2 : 4), 32); updateZoom(); }
function zoomOut() { state.zoom = Math.max(state.zoom - (state.zoom <= 4 ? 1 : state.zoom <= 8 ? 2 : 4), 1); updateZoom(); }
function updateZoom() {
  document.getElementById('zoom-val').textContent = state.zoom + '×';
  resizeCanvases();
}

document.getElementById('btn-zoom-in').addEventListener('click', zoomIn);
document.getElementById('btn-zoom-out').addEventListener('click', zoomOut);
document.getElementById('btn-undo').addEventListener('click', undo);
document.getElementById('btn-redo').addEventListener('click', redo);

document.getElementById('btn-uvgrid').addEventListener('click', function() {
  state.uvGrid = !state.uvGrid;
  this.classList.toggle('active', state.uvGrid);
  redrawOverlay();
});

// Brush size
document.getElementById('btn-brush-inc').addEventListener('click', () => {
  state.brushSize = Math.min(state.brushSize + 1, 16);
  document.getElementById('brush-val').textContent = state.brushSize;
});
document.getElementById('btn-brush-dec').addEventListener('click', () => {
  state.brushSize = Math.max(state.brushSize - 1, 1);
  document.getElementById('brush-val').textContent = state.brushSize;
});

// Color inputs
document.getElementById('color-preview').addEventListener('click', () => {
  document.getElementById('color-native').click();
});
document.getElementById('color-native').addEventListener('input', e => setColor(e.target.value));
document.getElementById('color-hex').addEventListener('change', e => {
  setColor(e.target.value);
});

// File open
document.getElementById('file-input').addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  const url = URL.createObjectURL(f);
  const img = new Image();
  img.onload = () => {
    pushUndo();
    pixelCtx.clearRect(0, 0, SKIN_W, SKIN_H);
    // If 64×64, take top half; if 64×32, use as-is
    if (img.width === 64 && (img.height === 32 || img.height === 64)) {
      pixelCtx.drawImage(img, 0, 0, 64, 32, 0, 0, SKIN_W, SKIN_H);
    } else {
      // Scale to fit
      pixelCtx.drawImage(img, 0, 0, SKIN_W, SKIN_H);
    }
    redrawSkin();
    update3dTexture();
    document.getElementById('status').textContent = `Loaded: ${f.name} (${img.width}×${img.height})`;
    URL.revokeObjectURL(url);
  };
  img.src = url;
  e.target.value = '';
});

// Export
document.getElementById('btn-export').addEventListener('click', () => {
  pixelCanvas.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'skin.png';
    a.click();

// ── Minecraft skin importer ─────────────────────────────────────────────────
// Converts a standard 64×32 (or 64×64) Minecraft skin PNG into the CNR 64×32
// UV layout and loads it into the editor.
function convertMinecraftSkin(srcImg) {
  // Draw the source image to a temp canvas so we can blit sub-rects
  const src = document.createElement('canvas');
  src.width = srcImg.width; src.height = srcImg.height;
  src.getContext('2d').drawImage(srcImg, 0, 0);

  const dest = document.createElement('canvas');
  dest.width = 64; dest.height = 32;
  const dc = dest.getContext('2d');

  // blit(sx,sy,w,h, dx,dy): copy a rect from the MC skin to the CNR canvas
  function blit(sx, sy, w, h, dx, dy) {
    dc.drawImage(src, sx, sy, w, h, dx, dy, w, h);
  }

  // ── HEAD (6 faces, all 8×8) ──────────────────────────────────────────────
  // MC standard:  front[8,8] right[0,8] left[16,8] back[24,8] top[8,0] bot[16,0]
  // CNR layout:   front[8,0] right[16,0] left[0,0] back[24,0] top[32,0] bot[40,0]
  blit( 8,  8,  8,  8,  8,  0);  // head front
  blit( 0,  8,  8,  8, 16,  0);  // head right
  blit(16,  8,  8,  8,  0,  0);  // head left
  blit(24,  8,  8,  8, 24,  0);  // head back
  blit( 8,  0,  8,  8, 32,  0);  // head top
  blit(16,  0,  8,  8, 40,  0);  // head bottom

  // ── BODY (front/back 8×12, sides 4×12, top 8×4) ─────────────────────────
  // MC: front[20,20] left[28,20] right[16,20] back[32,20] top[20,16]
  // CNR: front[4,8]  left[0,8]  right[12,8]  back[16,8]  top[24,8]
  blit(20, 20,  8, 12,  4,  8);  // body front
  blit(28, 20,  4, 12,  0,  8);  // body left
  blit(16, 20,  4, 12, 12,  8);  // body right
  blit(32, 20,  8, 12, 16,  8);  // body back
  blit(20, 16,  8,  4, 24,  8);  // body top
  blit(28, 16,  8,  4, 24, 12);  // body bottom

  // ── ARM (front/back 4×12, sides 4×12, caps 4×4) ─────────────────────────
  // MC right arm: right[40,20] front[44,20] left[48,20] back[52,20] top[44,16] bot[48,16]
  // CNR arm:      right[8,20]  front[4,20]  left[0,20]  back[12,20] top[16,20] bot[16,24]
  blit(44, 20,  4, 12,  4, 20);  // arm front
  blit(40, 20,  4, 12,  8, 20);  // arm right (outer)
  blit(48, 20,  4, 12,  0, 20);  // arm left (inner)
  blit(52, 20,  4, 12, 12, 20);  // arm back
  blit(44, 16,  4,  4, 16, 20);  // arm top
  blit(48, 16,  4,  4, 16, 24);  // arm bottom

  // ── LEGS (shaft only — feet must be painted manually) ────────────────────
  // MC right leg: right[0,20] front[4,20] left[8,20] back[12,20]  (x=0-16)
  // CNR leg shaft (x+20 offset): right[20,20] front[24,20] left[28,20] back[32,20]
  blit( 0, 20,  4, 12, 20, 20);  // leg right (outer)
  blit( 4, 20,  4, 12, 24, 20);  // leg front
  blit( 8, 20,  4, 12, 28, 20);  // leg left (inner)
  blit(12, 20,  4, 12, 32, 20);  // leg back

  return dest;
}

document.getElementById('mc-import-input').addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  const url = URL.createObjectURL(f);
  const img = new Image();
  img.onload = () => {
    if ((img.width !== 64) || (img.height !== 32 && img.height !== 64)) {
      document.getElementById('status').textContent = `Import failed: expected 64×32 or 64×64 PNG, got ${img.width}×${img.height}`;
      URL.revokeObjectURL(url);
      return;
    }
    pushUndo();
    const converted = convertMinecraftSkin(img);
    pixelCtx.clearRect(0, 0, SKIN_W, SKIN_H);
    pixelCtx.drawImage(converted, 0, 0, 64, 32, 0, 0, SKIN_W, SKIN_H);
    redrawSkin();
    update3dTexture();
    document.getElementById('status').textContent = `Imported MC skin: ${f.name} — feet area is blank, paint manually`;
    URL.revokeObjectURL(url);
  };
  img.src = url;
  e.target.value = '';
});

// Keyboard
window.addEventListener('keydown', e => {
  if (e.ctrlKey && e.key === 'z') { e.preventDefault(); undo(); }
  if (e.ctrlKey && (e.key === 'y' || (e.shiftKey && e.key === 'Z'))) { e.preventDefault(); redo(); }
  if (e.key === 'p' || e.key === 'P') setTool('pencil');
  if (e.key === 'e' || e.key === 'E') setTool('eraser');
  if (e.key === 'i' || e.key === 'I') { setTool('picker'); setModelTool('picker'); }
  if (e.key === '[') { state.brushSize = Math.max(1, state.brushSize - 1); document.getElementById('brush-val').textContent = state.brushSize; }
  if (e.key === ']') { state.brushSize = Math.min(16, state.brushSize + 1); document.getElementById('brush-val').textContent = state.brushSize; }
});

(text => {
  const lines = text.split('\n');

  // Collect all global vertex data
  const gPos = [], gUV = [], gNrm = [];
  for (const line of lines) {
    const p = line.trimStart().split(/\s+/);
    if      (p[0] === 'v')  gPos.push(+p[1], +p[2], +p[3]);
    else if (p[0] === 'vt') gUV.push(+p[1], +p[2]);
    else if (p[0] === 'vn') gNrm.push(+p[1], +p[2], +p[3]);
  }

  // Compute bounding box to center and normalize the model
  let xMin=1e9,xMax=-1e9,yMin=1e9,yMax=-1e9,zMin=1e9,zMax=-1e9;
  for (let i = 0; i < gPos.length; i += 3) {
    if (gPos[i]   < xMin) xMin=gPos[i];   if (gPos[i]   > xMax) xMax=gPos[i];
    if (gPos[i+1] < yMin) yMin=gPos[i+1]; if (gPos[i+1] > yMax) yMax=gPos[i+1];
    if (gPos[i+2] < zMin) zMin=gPos[i+2]; if (gPos[i+2] > zMax) zMax=gPos[i+2];
  }
  const cx = (xMin+xMax)/2, cy = (yMin+yMax)/2, cz = (zMin+zMax)/2;
  const scl = 2.0 / (yMax - yMin); // normalize to 2 units tall (-1..+1 in Y)

  // Build one BufferGeometry per named group
  let curName = null;
  const groups = {};
  for (const line of lines) {
    const p = line.trimStart().split(/\s+/);
    if (p[0] === 'g') {
      curName = p[1] || 'default';
      if (!groups[curName]) groups[curName] = { pos: [], uv: [], nrm: [] };
    } else if (p[0] === 'f' && curName) {
      const verts = p.slice(1).map(tok => {
        const [vi, ti, ni] = tok.split('/').map(s => parseInt(s) - 1);
        return { vi, ti: isNaN(ti) ? vi : ti, ni: isNaN(ni) ? vi : ni };
      });
      // Fan triangulate (all faces here are already tris, but be safe)
      for (let i = 1; i < verts.length - 1; i++) {
        for (const v of [verts[0], verts[i], verts[i+1]]) {
          const b = v.vi * 3;
          groups[curName].pos.push(
            (gPos[b]   - cx) * scl,
            (gPos[b+1] - cy) * scl,
            (gPos[b+2] - cz) * scl
          );
          const t = v.ti * 2;
          groups[curName].uv.push(gUV[t], gUV[t+1]);
          if (gNrm.length) {
            const n = v.ni * 3;
            groups[curName].nrm.push(gNrm[n], gNrm[n+1], gNrm[n+2]);
          }
        }
      }
    }
  }

  for (const [name, data] of Object.entries(groups)) {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(data.pos, 3));
    geo.setAttribute('uv',       new THREE.Float32BufferAttribute(data.uv,  2));
    if (data.nrm.length) geo.setAttribute('normal', new THREE.Float32BufferAttribute(data.nrm, 3));
    else geo.computeVertexNormals();
    const mesh = new THREE.Mesh(geo, skinMat);
    mesh.name = name;
    partMeshes[name] = mesh;
    playerGroup.add(mesh);
  }
  buildPartsUI();
})(CHARACTER_OBJ);

// ─── Preview resize ───────────────────────────────────────────────────────────

function resizePreview() {
  const panel = document.getElementById('right-panel');
  const h3    = panel.querySelector('h3');
  const w = panel.clientWidth;
  const h = panel.clientHeight - h3.offsetHeight;
  prevRenderer.setSize(w, h);
  prevCamera.aspect = w / h;
  prevCamera.updateProjectionMatrix();
}

new ResizeObserver(resizePreview).observe(document.getElementById('right-panel'));
resizePreview();

// ─── Animation loop ───────────────────────────────────────────────────────────

function animate() {
  requestAnimationFrame(animate);
  orbitPrev.update();
  prevRenderer.render(prevScene, prevCamera);
}
animate();

// ─── Initial canvas size ─────────────────────────────────────────────────────

window.addEventListener('resize', resizeCanvases);
resizeCanvases();

// Position overlay canvas over skin canvas
function positionOverlay() {
  const sc  = skinCanvas;
  const ov  = overlayCanvas;
  const wrap = document.getElementById('canvas-wrap');
  ov.style.position = 'absolute';
  ov.style.left = sc.offsetLeft + 'px';
  ov.style.top  = sc.offsetTop  + 'px';
}
new ResizeObserver(() => { resizeCanvases(); positionOverlay(); }).observe(document.getElementById('canvas-wrap'));

// ─── Mode switching ───────────────────────────────────────────────────────────

let appMode = 'uv';
let modelTool = 'select';
let selectedPart = null;

function switchMode(mode) {
  appMode = mode;
  document.body.classList.toggle('uv-mode',    mode === 'uv');
  document.body.classList.toggle('model-mode', mode === 'model');
  document.getElementById('tab-uv').classList.toggle('active',    mode === 'uv');
  document.getElementById('tab-model').classList.toggle('active', mode === 'model');
  document.getElementById('panel-3d-title').textContent =
    mode === 'uv' ? '3D Preview — drag to rotate' : '3D Model Editor — right-drag to rotate';
  if (mode === 'model') {
    orbitPrev.mouseButtons = { LEFT: null, MIDDLE: THREE.MOUSE.PAN, RIGHT: THREE.MOUSE.ROTATE };
    previewCanvas.style.cursor = (modelTool === 'paint' || modelTool === 'picker') ? 'crosshair' : 'default';
  } else {
    orbitPrev.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.PAN };
    previewCanvas.style.cursor = '';
  }
  setTimeout(resizePreview, 0);
}

document.getElementById('tab-uv').addEventListener('click',    () => switchMode('uv'));
document.getElementById('tab-model').addEventListener('click', () => switchMode('model'));

// ─── Model tools ─────────────────────────────────────────────────────────────

function setModelTool(t) {
  modelTool = t;
  document.querySelectorAll('.model-tool-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.tool === t)
  );
  if (appMode === 'model') previewCanvas.style.cursor = (t === 'paint' || t === 'picker') ? 'crosshair' : 'default';
}

document.querySelectorAll('.model-tool-btn').forEach(b =>
  b.addEventListener('click', () => setModelTool(b.dataset.tool))
);

// ─── Part visibility ─────────────────────────────────────────────────────────

function buildPartsUI() {
  const list = document.getElementById('parts-list');
  if (!list) return;
  list.innerHTML = '';
  const ORDER  = ['head', 'trunk', 'hand_left', 'hand_right', 'leg_left', 'leg_right'];
  const LABELS = { head: 'Head', trunk: 'Torso', hand_left: 'Arm L', hand_right: 'Arm R', leg_left: 'Leg L', leg_right: 'Leg R' };
  const names  = ORDER.filter(n => partMeshes[n]).concat(Object.keys(partMeshes).filter(n => !ORDER.includes(n)));
  for (const name of names) {
    const row = document.createElement('div');
    row.className = 'part-row';
    row.dataset.part = name;

    const eye = document.createElement('button');
    eye.className = 'part-eye';
    eye.textContent = '👁';
    eye.title = 'Toggle visibility';
    eye.style.opacity = '1';
    eye.addEventListener('click', e => {
      e.stopPropagation();
      const mesh = partMeshes[name];
      mesh.visible = !mesh.visible;
      eye.style.opacity = mesh.visible ? '1' : '0.3';
    });

    const label = document.createElement('span');
    label.className = 'part-label';
    label.textContent = LABELS[name] || name;

    const iso = document.createElement('button');
    iso.className = 'part-isolate';
    iso.textContent = 'iso';
    iso.title = 'Show only this part';
    iso.addEventListener('click', e => { e.stopPropagation(); isolatePart(name); });

    row.appendChild(eye);
    row.appendChild(label);
    row.appendChild(iso);
    row.addEventListener('click', () => selectPart(name));
    list.appendChild(row);
  }
}

function selectPart(name) {
  selectedPart = name;
  document.querySelectorAll('.part-row').forEach(r =>
    r.classList.toggle('selected', r.dataset.part === name)
  );
}

function isolatePart(name) {
  for (const [n, mesh] of Object.entries(partMeshes)) mesh.visible = (n === name);
  document.querySelectorAll('.part-row').forEach(r => {
    const eye = r.querySelector('.part-eye');
    if (eye) eye.style.opacity = partMeshes[r.dataset.part]?.visible ? '1' : '0.3';
  });
  selectPart(name);
}

document.getElementById('btn-show-all')?.addEventListener('click', () => {
  for (const mesh of Object.values(partMeshes)) mesh.visible = true;
  document.querySelectorAll('.part-row .part-eye').forEach(e => { e.style.opacity = '1'; });
});

// ─── Model paint & select (raycaster) ────────────────────────────────────────

const raycaster = new THREE.Raycaster();
let modelPainting = false;

function paintOnModel(clientX, clientY) {
  const rect = previewCanvas.getBoundingClientRect();
  const ndcX =  ((clientX - rect.left) / rect.width)  * 2 - 1;
  const ndcY = -((clientY - rect.top)  / rect.height) * 2 + 1;
  raycaster.setFromCamera(new THREE.Vector2(ndcX, ndcY), prevCamera);
  const hits = raycaster.intersectObjects(Object.values(partMeshes).filter(m => m.visible), false);
  if (!hits.length || !hits[0].uv) return;
  const px = Math.floor(hits[0].uv.x * SKIN_W);
  const py = Math.floor((1 - hits[0].uv.y) * SKIN_H);
  paintPixel(px, py);
}

previewCanvas.addEventListener('contextmenu', e => e.preventDefault());

previewCanvas.addEventListener('mousedown', e => {
  if (appMode !== 'model' || e.button !== 0) return;
  const rect = previewCanvas.getBoundingClientRect();
  const ndcX =  ((e.clientX - rect.left) / rect.width)  * 2 - 1;
  const ndcY = -((e.clientY - rect.top)  / rect.height) * 2 + 1;
  raycaster.setFromCamera(new THREE.Vector2(ndcX, ndcY), prevCamera);
  const hits = raycaster.intersectObjects(Object.values(partMeshes).filter(m => m.visible), false);
  if (modelTool === 'picker') {
    if (hits.length && hits[0].uv) {
      const px = Math.floor(hits[0].uv.x * SKIN_W);
      const py = Math.floor((1 - hits[0].uv.y) * SKIN_H);
      pickColorFromPixel(px, py);
    }
    return;
  } else if (modelTool === 'paint') {
    pushUndo();
    addRecentColor(state.color);
    modelPainting = true;
    if (hits.length && hits[0].uv) {
      const px = Math.floor(hits[0].uv.x * SKIN_W);
      const py = Math.floor((1 - hits[0].uv.y) * SKIN_H);
      paintPixel(px, py);
    }
  } else if (modelTool === 'select' && hits.length) {
    selectPart(hits[0].object.name);
  }
});

previewCanvas.addEventListener('mousemove', e => {
  if (appMode !== 'model' || modelTool !== 'paint' || !modelPainting) return;
  paintOnModel(e.clientX, e.clientY);
});

window.addEventListener('mouseup', () => { modelPainting = false; });

// ─── Init ─────────────────────────────────────────────────────────────────────

switchMode('uv');

</script>
</body>
